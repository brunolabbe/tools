<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirected, then a fragment-only play</title>
  </head>
  <body>
    <h1>Redirected, then a fragment-only play</h1>
    <!-- Proves the landing URL is the page reached after the redirect, not
         the URL first requested: a fragment-only change here is only "not a
         departure" if the guard is comparing against this page's own path,
         not the pre-redirect one (dl-55, decision 2). -->
    <button id="play" type="button">Play</button>
    <p id="status">idle</p>

    <script>
      (function () {
        var started = false;
        function start() {
          if (started) return;
          started = true;
          location.hash = "#t=0";
          fetch("/media/hls/master.m3u8")
            .then(function (r) {
              return r.text();
            })
            .then(function () {
              return fetch("/media/hls/v720.m3u8");
            })
            .then(function () {
              document.getElementById("status").textContent = "playing";
            })
            .catch(function () {});
        }
        document.getElementById("play").addEventListener("click", start);
      })();
    </script>
  </body>
</html>
