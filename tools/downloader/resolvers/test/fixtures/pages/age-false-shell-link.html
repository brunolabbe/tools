<!doctype html>
<!-- dl-83 gate round 1, page "shell-a-link" (mode stream), generated from the gate's harness: a position: fixed app shell whose nav has an <a href> "18+" link to another page, and whose text says "Updated 18 minutes ago". The stream starts on load. Recognised; the link must never be pressed, because it leaves the document. Every press reports to a /beacon/ path. -->
<html lang="en"><head><meta charset="utf-8"><title>Shell a</title></head>
<body style="margin:0;font-family:sans-serif">
<div id="app" style="position:fixed;inset:0;overflow:auto;background:#fafafa">
  <header style="padding:8px;background:#fff"><a href="/dest/category-18.html" id="n18" >18+</a> <a href="/dest/home.html">Home</a></header>
  <main style="padding:16px">
    <h1>Watch</h1>
    <p><span>Updated 18 minutes ago</span> &middot; <span>21 comments</span></p>
    
    <div id="player" class="player" style="width:640px;height:360px;background:#222"></div>
  </main></div>
<script>
function beacon(n){fetch('/beacon/'+n).catch(function(){});}
function startStream(){
  var v=document.createElement('video'); v.muted=true; v.width=640; v.height=360;
  fetch('/media/mse/master.m3u8').then(function(r){return r.text();})
    .then(function(){return fetch('/media/mse/v1080.m3u8');})
    .then(function(r){return r.text();})
    .then(function(){return Promise.all(['/media/mse/init.mp4','/media/mse/seg-00001.m4s','/media/mse/seg-00002.m4s'].map(function(u){return fetch(u);}));})
    .catch(function(){});
  var ms=new MediaSource(); v.src=URL.createObjectURL(ms);
  document.getElementById('player').replaceChildren(v);
}

startStream();

document.getElementById('n18').addEventListener('click',function(){beacon('nav-18');});
</script></body></html>
