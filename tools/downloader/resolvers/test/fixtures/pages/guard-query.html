<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Guard: query rewrite on play</title>
  </head>
  <body>
    <h1>Guard: query rewrite on play</h1>
    <!-- ?rewrite=t adds `t` on play, through a same-document
         history.replaceState - never a real navigation. `t` is one of the
         narrow exception's three keys (dl-55, decision 1); the others, another
         key and a reordered query were modes of this page until dl-114, which
         tables them against `sameDocument` without a browser. -->
    <button id="play" type="button">Play</button>
    <p id="status">idle</p>

    <script>
      (function () {
        var started = false;
        function start() {
          if (started) return;
          started = true;
          var params = new URLSearchParams(location.search);
          var mode = params.get("rewrite");
          if (mode === "t") params.set("t", "5");
          history.replaceState(null, "", location.pathname + "?" + params.toString());
          document.getElementById("status").textContent = "loading";
          fetch("/media/hls/master.m3u8")
            .then(function (r) {
              return r.text();
            })
            .then(function () {
              return fetch("/media/hls/v720.m3u8");
            })
            .then(function (r) {
              return r.text();
            })
            .then(function () {
              document.getElementById("status").textContent = "playing";
            })
            .catch(function () {});
        }
        document.getElementById("play").addEventListener("click", start);
      })();
    </script>
  </body>
</html>
