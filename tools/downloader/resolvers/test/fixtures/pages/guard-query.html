<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Guard: query rewrite on play</title>
  </head>
  <body>
    <h1>Guard: query rewrite on play</h1>
    <!-- ?rewrite= picks which query key the play control adds on play,
         through a same-document history.replaceState — never a real
         navigation. `t`, `start` and `autoplay` are the narrow exception
         (dl-55, decision 1); `other` still counts as a departure; `reorder`
         changes no parameter's value, only the order the same ones appear in
         (dl-55, decision 5). -->
    <button id="play" type="button">Play</button>
    <p id="status">idle</p>

    <script>
      (function () {
        var started = false;
        function start() {
          if (started) return;
          started = true;
          var params = new URLSearchParams(location.search);
          var mode = params.get("rewrite");
          if (mode === "t") params.set("t", "5");
          else if (mode === "start") params.set("start", "10");
          else if (mode === "autoplay") params.set("autoplay", "1");
          else if (mode === "other") params.set("v", "other");
          else if (mode === "reorder") {
            var entries = Array.from(params.entries()).filter(function (entry) {
              return entry[0] !== "rewrite";
            });
            entries.reverse();
            params = new URLSearchParams();
            params.set("rewrite", mode);
            entries.forEach(function (entry) {
              params.append(entry[0], entry[1]);
            });
          }
          history.replaceState(null, "", location.pathname + "?" + params.toString());
          document.getElementById("status").textContent = "loading";
          fetch("/media/hls/master.m3u8")
            .then(function (r) {
              return r.text();
            })
            .then(function () {
              return fetch("/media/hls/v720.m3u8");
            })
            .then(function () {
              document.getElementById("status").textContent = "playing";
            })
            .catch(function () {});
        }
        document.getElementById("play").addEventListener("click", start);
      })();
    </script>
  </body>
</html>
