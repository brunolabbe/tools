<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Guard: a reload that asks for the same manifest</title>
  </head>
  <body>
    <h1>Guard: a reload that asks for the same manifest</h1>
    <!-- Both documents of a same-address reload fetch the same manifest URL (dl-144, gate 3). The collector keeps one hit per URL: the live document's request must count for the live document. -->
    <script>
      (function () {
        fetch("/media/hls/master.m3u8")
          .then(function (r) {
            return r.text();
          })
          .then(function () {
            return fetch("/media/hls/v720.m3u8");
          })
          .then(function (r) {
            return r.text();
          })
          .catch(function () {});
        if (document.cookie.indexOf("reloaded=1") < 0) {
          document.cookie = "reloaded=1; path=/";
          window.addEventListener("load", function () {
          setTimeout(function () {
            location.reload();
          }, 1000);
        });
        }
      })();
    </script>
  </body>
</html>
