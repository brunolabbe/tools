<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Untyped manifest player</title>
  </head>
  <body>
    <h1>Untyped manifest player</h1>
    <!-- dl-79: a player that fetches its playlist from an API route, with no
         extension and a type that says nothing (`text/plain` or
         `application/octet-stream`). Only the body shows it is a manifest. The
         route comes in as ?src= and the segments it then fetches as ?segs=, so
         one page covers every shape the tests need. -->
    <video id="v" width="640" height="360" muted playsinline controls></video>
    <p id="status">idle</p>

    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var src = params.get("src") || "/api/playlist?id=1";
        // An empty ?segs= means "fetch none"; only an absent one takes the default.
        var segs = (
          params.has("segs") ? params.get("segs") : "/media/untyped/seg-00001.ts,/media/untyped/seg-00002.ts"
        )
          .split(",")
          .filter(Boolean);
        var status = document.getElementById("status");
        status.textContent = "loading";
        fetch(src)
          .then(function (r) {
            return r.text();
          })
          .then(function () {
            return Promise.all(
              segs.map(function (url) {
                return fetch(url).then(function (r) {
                  return r.arrayBuffer();
                });
              }),
            );
          })
          .then(function () {
            status.textContent = "segments fetched";
          })
          .catch(function () {});
      })();
    </script>
  </body>
</html>
