<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Articolo</title>
  </head>
  <body>
    <h1>Articolo</h1>
    <div id="player"></div>
    <!-- dl-82's gate: the same order trap with a bottom consent bar that covers
         nothing, so the press on the newsletter's "Ho capito" lands instead of
         timing out, and the consent button is never reached. -->
    <div class="newsletter">
      <button type="button" onclick="fetch('/beacon/newsletter-hocapito')">Ho capito</button>
    </div>
    <div
      id="consent"
      style="position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 12px; background: #eee"
    >
      Usiamo i cookie.
      <button
        type="button"
        onclick="fetch('/beacon/consent-accepted');document.getElementById('consent').remove();mountPlayer()"
      >
        Accetta
      </button>
    </div>
    <script>
      function mountPlayer() {
        fetch("/media/mse/master.m3u8")
          .then(function (r) {
            return r.text();
          })
          .then(function () {
            return fetch("/media/mse/v1080.m3u8");
          })
          .then(function (r) {
            return r.text();
          })
          .then(function () {
            return Promise.all(
              ["/media/mse/init.mp4", "/media/mse/seg-00001.m4s", "/media/mse/seg-00002.m4s"].map(
                function (u) {
                  return fetch(u);
                },
              ),
            );
          })
          .catch(function () {});
        var v = document.createElement("video");
        v.muted = true;
        v.width = 640;
        v.height = 360;
        v.src = URL.createObjectURL(new MediaSource());
        document.getElementById("player").replaceChildren(v);
      }
    </script>
  </body>
</html>
