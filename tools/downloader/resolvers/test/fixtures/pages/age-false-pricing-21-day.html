<!doctype html>
<!-- dl-83 gate round 1, page "pricing-b-21day" (mode stream), generated from the gate's harness: a pricing modal, "Try Pro free for 21 days", <a href> "Start 21-day trial". The stream starts on load. Recognised; the link must never be pressed. Every press reports to a /beacon/ path. -->
<html lang="en"><head><meta charset="utf-8"><title>Pricing b</title></head>
<body style="margin:0;font-family:sans-serif">
<div id="player" class="player" style="width:640px;height:360px;background:#222"></div><div role="dialog" aria-modal="true" style="position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6)"><div style="width:420px;padding:24px;background:#fff;color:#000">
<h2>Upgrade to Pro</h2><p>Try Pro free for 21 days. Cancel anytime.</p>
<a href="/dest/trial.html" id="trial">Start 21-day trial</a> <button type="button">Maybe later</button></div></div>
<script>
function beacon(n){fetch('/beacon/'+n).catch(function(){});}
function startStream(){
  var v=document.createElement('video'); v.muted=true; v.width=640; v.height=360;
  fetch('/media/mse/master.m3u8').then(function(r){return r.text();})
    .then(function(){return fetch('/media/mse/v1080.m3u8');})
    .then(function(r){return r.text();})
    .then(function(){return Promise.all(['/media/mse/init.mp4','/media/mse/seg-00001.m4s','/media/mse/seg-00002.m4s'].map(function(u){return fetch(u);}));})
    .catch(function(){});
  var ms=new MediaSource(); v.src=URL.createObjectURL(ms);
  document.getElementById('player').replaceChildren(v);
}

startStream();

document.getElementById('trial').addEventListener('click',function(){beacon('trial');});
</script></body></html>
