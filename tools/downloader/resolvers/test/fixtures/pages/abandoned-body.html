<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Abandoned body</title>
  </head>
  <body>
    <h1>Abandoned body</h1>
    <!-- The one page that fetches a playlist and never reads it (dl-111). The
         collector's body read for that request never completes, so the probe
         ends on settle()'s cap instead of on the read. Every other fixture
         reads what it fetches, so a test that is not about the cap does not
         wait for it. -->
    <button id="play" type="button">Play</button>
    <video id="v" width="640" height="360" muted playsinline controls></video>
    <p id="status">idle</p>

    <script>
      (function () {
        var started = false;
        function start() {
          if (started) return;
          started = true;
          fetch("/media/hls/master.m3u8")
            .then(function (r) {
              return r.text();
            })
            .then(function () {
              // Never read: this is the abandoned body.
              return fetch("/media/hls/v720.m3u8");
            })
            .then(function () {
              document.getElementById("status").textContent = "playing";
            })
            .catch(function () {});
        }
        document.getElementById("play").addEventListener("click", start);
      })();
    </script>
  </body>
</html>
