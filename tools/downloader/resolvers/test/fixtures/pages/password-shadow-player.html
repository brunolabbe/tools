<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Password page, shadow-root player</title>
  </head>
  <body>
    <!-- dl-69's reproduction: a password field in the light DOM (an unrelated
         site-nav login, a comments section, a newsletter gate) alongside a
         real player whose only `<video>` lives inside an open shadow root.
         `hasPlayerElement`'s old `document.querySelector` missed it, and
         `classifyFailure` returned `AUTH_REQUIRED` (`reason: "login-form"`)
         instead of falling through to the next resolver tier. -->
    <h1>Sign in</h1>
    <form>
      <input type="password" name="password" />
    </form>
    <div id="host"></div>
    <script>
      (function () {
        var root = document.getElementById("host").attachShadow({ mode: "open" });
        root.innerHTML = '<video id="sv" width="640" height="360" muted playsinline></video>';
      })();
    </script>
  </body>
</html>
