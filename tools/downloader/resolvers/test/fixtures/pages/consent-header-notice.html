<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Articolo</title>
  </head>
  <body>
    <!-- dl-82 gate 2, row (iii): a sticky site header holding a notice, whose
         label comes from ?label=. Its text says nothing of cookies or consent, so
         the header is not a consent container: "Ho capito" (added by dl-82) is not
         pressed, and "OK" (a label the old pattern pressed anywhere) still is. -->
    <header style="position: sticky; top: 0; background: #fff">
      <nav><a href="#a">Home</a></nav>
      <div class="notice">
        Nuove condizioni di spedizione.
        <button id="notice-button" type="button" onclick="fetch('/beacon/header-notice')">
          Ho capito
        </button>
      </div>
    </header>
    <h1>Articolo</h1>
    <div id="player"></div>
    <div style="height: 2000px"></div>
    <script>
      var params = new URLSearchParams(location.search);
      var label = params.get("label");
      if (label !== null) document.getElementById("notice-button").textContent = label;

      // dl-82 gate 3. ?note= replaces the notice's sentence. ?menu=link puts a
      // "Cookie policy" link in the header's nav, ?menu=hidden puts it in a menu
      // that is display: none: either way the header's prose still says nothing
      // of cookies, only a link or a hidden node does.
      var note = params.get("note");
      if (note !== null) document.querySelector(".notice").firstChild.nodeValue = note + " ";
      var menu = params.get("menu");
      if (menu !== null) {
        var link = document.createElement("a");
        link.href = "#c";
        link.textContent = "Cookie policy";
        var nav = document.querySelector("nav");
        if (menu === "hidden") {
          var list = document.createElement("ul");
          list.style.display = "none";
          list.append(link);
          nav.append(list);
        } else {
          nav.append(link);
        }
      }
    </script>
  </body>
</html>
