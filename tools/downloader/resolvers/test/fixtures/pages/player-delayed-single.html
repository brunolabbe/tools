<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A video page whose player iframe is filled by a delayed script</title>
  </head>
  <body style="margin: 0">
    <!-- dl-143: the shape of a WordPress page under a delay-JS plugin. The player
         is one iframe at about:blank with its address base64-encoded in
         `data-enc`, and nothing on the page runs until the window sees a first
         interaction; 1.2 s after that the player script sets the iframe's `src`.
         There is no tab. With `?plain` the iframe is a div instead, which is the
         same page with no blank player iframe, and with `?hover` only a pointer over the window releases it, with `?reload` its first interaction reloads the page once (a cookie marks the second visit, which is `?hover`'s), and with `?never` the script
         releases but never fills the iframe. -->
    <div class="player-wrap" id="wrap" style="padding-top: 200px">
      <iframe
        id="player-0"
        class="player-frame"
        src="about:blank"
        width="640"
        height="360"
        style="border: 0"
        loading="lazy"
        title="Video player"
      ></iframe>
    </div>

    <script>
      (function () {
        var query = location.search;
        if (query.indexOf("plain") !== -1) {
          document.getElementById("wrap").innerHTML =
            '<div class="player-frame" style="width: 640px; height: 360px"></div>';
        }
        var frame = document.getElementById("player-0");
        var embed = "{{SECONDARY}}/player-delayed-embed-hop.html";
        if (frame) frame.setAttribute("data-enc", btoa(embed + "?player=0"));
        // The reloaded document (`?reload`, second visit) puts its player iframe in
        // only 600 ms later, as a page that builds its player in script does, so a
        // probe that looks for it straight after the reload finds none yet.
        if (frame && query.indexOf("reload") !== -1 && document.cookie.indexOf("dl143reload=1") !== -1) {
          var holder = frame.parentNode;
          holder.removeChild(frame);
          setTimeout(function () {
            holder.appendChild(frame);
          }, 600);
        }

        // The delay-JS loader: nothing below the listeners runs until the window
        // sees one of these, registered on window and passive the way the plugin
        // does it, and no timer runs it anyway. A timer then stands in for the
        // delayed bundle loading.
        var EVENTS = [
          "mouseover",
          "click",
          "keydown",
          "wheel",
          "touchmove",
          "touchstart",
          "pointerup",
          "pointerdown",
        ];
        // With `?hover` only a pointer hearing the window releases it: no wheel,
        // click, key or touch, and the page is too short to scroll, so the
        // probe's scroll moves nothing and sends nothing the page listens to.
        var hoverOnly = query.indexOf("hover") !== -1 || query.indexOf("reload") !== -1;
        if (hoverOnly) EVENTS = ["mouseover", "pointerup", "pointerdown"];
        // With `?reload` the first visit is a cache plugin's first-visit page: its
        // first interaction sets a cookie and reloads the document, which is how a
        // reload comes to land while the probe waits on the iframe. The second
        // visit, with the cookie, is the page as `?hover` has it. The reload is
        // tied to the interaction rather than a timer so that it lands in the wait
        // every run.
        var firstVisit =
          query.indexOf("reload") !== -1 && document.cookie.indexOf("dl143reload=1") === -1;
        var released = false;
        function release() {
          if (released) return;
          released = true;
          if (firstVisit) {
            document.cookie = "dl143reload=1; path=/";
            location.reload();
            return;
          }
          for (var k = 0; k < EVENTS.length; k++) window.removeEventListener(EVENTS[k], release);
          setTimeout(playerScript, hoverOnly ? 500 : 1200);
        }
        function listen() {
          for (var j = 0; j < EVENTS.length; j++) {
            window.addEventListener(EVENTS[j], release, { passive: true });
          }
        }
        // With `?hover` the listeners go on 300 ms after `load`, as the plugin's do
        // (live, the mouseover the browser sends at load had already gone by), so
        // the pointer that Playwright's context starts with does not release it.
        if (hoverOnly) {
          window.addEventListener("load", function () {
            setTimeout(listen, 300);
          });
        } else {
          listen();
        }

        function playerScript() {
          if (!frame || query.indexOf("never") !== -1) return;
          // js/xss-through-dom, excused under docs/adr/005 by category, in
          // tools/downloader/resolvers/test/fixtures/pages/player-delayed-single.html,
          // 2026-11-15, by the owner (dl-143, answer A): this is a test fixture,
          // served only by the test's own server, and it copies a DOM attribute
          // into an iframe's src on purpose, because that is the page dl-143
          // reproduces: the live page keeps the player's address in a data
          // attribute and sets it only once a delay-JS plugin has run its scripts.
          // It never ships, and no visitor reaches it. Field five has no production
          // design behind it to regress: what goes red if the fixture stops doing
          // it is "a player iframe that a delay-JS plugin fills after the first
          // interaction resolves" in browser-resolver-press-targets.test.ts, since
          // the iframe then stays blank and the probe ends NO_MEDIA_FOUND.
          // The assignment is on one line because the suppression covers exactly
          // the line after the comment.
          // codeql[js/xss-through-dom]
          frame.src = atob(frame.getAttribute("data-enc"));
        }
      })();
    </script>
  </body>
</html>
