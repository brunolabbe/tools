<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Guard: an embed that moves itself to a mirror</title>
  </head>
  <body>
    <h1>Guard: an embed that moves itself to a mirror</h1>
    <!-- One file for both origins, so the mirror is at the same path (dl-144).
         On the primary origin the page's own script replaces the top frame
         with the same path on the secondary origin ~1000 ms after `load`:
         past `LANDING_URL_SETTLE_MS`, before this tier has pressed anything
         (there is nothing here to press). On the secondary origin the player
         asks for its manifest on load, with no click, as the real mirror does. -->
    <p id="status">idle</p>

    <script>
      (function () {
        if (location.origin === "{{PRIMARY}}") {
          // The first document asks for a manifest of its own before it moves
          // on, as the real embed's does; it is in the collector when the hop
          // happens (dl-144 decides what becomes of it).
          fetch("/media/hls/master.m3u8").catch(function () {});
          window.addEventListener("load", function () {
            setTimeout(function () {
              location.replace("{{SECONDARY}}" + location.pathname);
            }, 1000);
          });
          return;
        }
        fetch("/media/hls/master.m3u8")
          .then(function (r) {
            return r.text();
          })
          .then(function () {
            return fetch("/media/hls/v720.m3u8");
          })
          .then(function (r) {
            return r.text();
          })
          .then(function () {
            document.getElementById("status").textContent = "playing";
          })
          .catch(function () {});
      })();
    </script>
  </body>
</html>
