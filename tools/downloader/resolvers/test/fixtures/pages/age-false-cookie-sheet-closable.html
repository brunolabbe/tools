<!doctype html>
<!-- dl-83 gate round 1, page "cookie-b" (mode click), generated from the gate's harness: a 120 px role=dialog cookie sheet, "our 18 partners", <button> "View our 18 partners" opening a closable vendor panel, and an accept label dismissConsent does not know; the player starts only on a click. Accepted residue: the button is pressed and the panel stops the play click. Every press reports to a /beacon/ path. -->
<html lang="en"><head><meta charset="utf-8"><title>Cookie b</title></head>
<body style="margin:0;font-family:sans-serif">
<div id="player" class="player" style="width:640px;height:360px;background:#222"></div>
<div role="dialog" aria-label="Cookies" style="position:fixed;bottom:0;left:0;right:0;height:120px;z-index:10;background:#fff;color:#000;padding:12px">
  <p>We and our 18 partners store and access information on your device.</p>
  <button type="button" id="partners">View our 18 partners</button>
  <button type="button" id="accept">Accept All Cookies</button>
</div>
<script>
function beacon(n){fetch('/beacon/'+n).catch(function(){});}
function startStream(){
  var v=document.createElement('video'); v.muted=true; v.width=640; v.height=360;
  fetch('/media/mse/master.m3u8').then(function(r){return r.text();})
    .then(function(){return fetch('/media/mse/v1080.m3u8');})
    .then(function(r){return r.text();})
    .then(function(){return Promise.all(['/media/mse/init.mp4','/media/mse/seg-00001.m4s','/media/mse/seg-00002.m4s'].map(function(u){return fetch(u);}));})
    .catch(function(){});
  var ms=new MediaSource(); v.src=URL.createObjectURL(ms);
  document.getElementById('player').replaceChildren(v);
}


var b=document.createElement('button');b.className='vjs-big-play-button';b.type='button';b.textContent='Start';b.onclick=function(){beacon('play');startStream();};document.getElementById('player').appendChild(b);

  document.getElementById('partners').addEventListener('click',function(){
    beacon('view-partners');
    var p=document.createElement('div'); p.id='vendors';
    p.style.cssText='position:fixed;inset:0;z-index:20;background:#fff;color:#000;padding:24px';
    p.innerHTML='<h2>Our partners</h2><button type="button" aria-label="Close" id="vclose">\u00d7</button>';
    document.body.appendChild(p);
    document.getElementById('vclose').addEventListener('click',function(){p.remove();});
  });document.getElementById('accept').addEventListener('click',function(){beacon('accept');});
</script></body></html>
