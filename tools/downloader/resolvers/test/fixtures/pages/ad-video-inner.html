<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ad</title>
  </head>
  <body style="margin: 0">
    <video id="ad" width="300" height="250" muted playsinline></video>
    <script>
      document.getElementById("ad").addEventListener("play", function () {
        fetch("/beacon/ad-played").catch(function () {});
        fetch("/media/related/master.m3u8")
          .then(function (r) {
            return r.text();
          })
          .catch(function () {});
      });
    </script>
  </body>
</html>
