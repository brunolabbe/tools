<!doctype html>
<!-- dl-83 gate round 1, page "inline-gate-plus-cookie" (mode none), generated from the gate's harness: dl-48's inline gate ("adults only" and an unpositioned "I am 18 or older" button that starts the stream) beside a 120 px role=dialog cookie sheet with "View our 18 partners". The gate's entry must be pressed, never the sheet's button. Every press reports to a /beacon/ path. -->
<html lang="en"><head><meta charset="utf-8"><title>Inline gate + cookie</title></head>
<body style="margin:0;font-family:sans-serif"><h1>Channel</h1><p>This channel is for adults only.</p>
<div id="gate"><button type="button" id="enter">I am 18 or older</button></div><div id="player" class="player" style="width:640px;height:360px;background:#222"></div>
<div role="dialog" aria-label="Cookies" style="position:fixed;bottom:0;left:0;right:0;height:120px;z-index:10;background:#fff;color:#000;padding:12px">
  <p>We and our 18 partners store and access information on your device.</p>
  <button type="button" id="partners">View our 18 partners</button>
  <button type="button" id="accept">Accept All Cookies</button>
</div><script>
function beacon(n){fetch('/beacon/'+n).catch(function(){});}
function startStream(){
  var v=document.createElement('video'); v.muted=true; v.width=640; v.height=360;
  fetch('/media/mse/master.m3u8').then(function(r){return r.text();})
    .then(function(){return fetch('/media/mse/v1080.m3u8');})
    .then(function(r){return r.text();})
    .then(function(){return Promise.all(['/media/mse/init.mp4','/media/mse/seg-00001.m4s','/media/mse/seg-00002.m4s'].map(function(u){return fetch(u);}));})
    .catch(function(){});
  var ms=new MediaSource(); v.src=URL.createObjectURL(ms);
  document.getElementById('player').replaceChildren(v);
}
document.getElementById('enter').addEventListener('click',function(){beacon('age-confirmed');document.getElementById('gate').remove();startStream();});
document.getElementById('partners').addEventListener('click',function(){beacon('view-partners');});</script></body></html>
