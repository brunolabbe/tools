<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shadow-root player, off-screen</title>
  </head>
  <body>
    <h1>Shadow-root player, off-screen</h1>
    <!-- SCRATCH for dl-69's measurement, reverted after the run. Same shape as
         shadow-player.html (click-only start, no `play` listener), but pushed
         6000px down the page so it starts well outside the initial viewport. -->
    <div style="height: 6000px"></div>
    <div id="host"></div>
    <p id="status">idle</p>

    <script>
      (function () {
        var root = document.getElementById("host").attachShadow({ mode: "open" });
        root.innerHTML = '<video id="sv" width="640" height="360" muted playsinline></video>';
        var started = false;
        function start() {
          if (started) return;
          started = true;
          document.getElementById("status").textContent = "loading";
          fetch("/media/related/master.m3u8")
            .then(function (r) {
              return r.text();
            })
            .then(function () {
              return fetch("/media/related/v720.m3u8");
            })
            .then(function () {
              document.getElementById("status").textContent = "playing";
            })
            .catch(function () {});
        }
        root.getElementById("sv").addEventListener("click", start);
      })();
    </script>
  </body>
</html>
