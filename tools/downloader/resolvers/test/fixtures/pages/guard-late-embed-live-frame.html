<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Guard: a mirror whose frame is the original address</title>
  </head>
  <body>
    <h1>Guard: a mirror whose frame is the original address</h1>
    <!-- The top frame hops to a mirror, and the mirror frames the address the top frame left; that frame plays (dl-144, gate 2). A frame of the document now showing is live whatever its address. -->
    <script>
      (function () {
        if (window.top !== window.self) {
          fetch("/media/hls/master.m3u8")
          .then(function (r) {
            return r.text();
          })
          .then(function () {
            return fetch("/media/hls/v720.m3u8");
          })
          .then(function (r) {
            return r.text();
          })
          .catch(function () {});
          return;
        }
        if (location.origin === "{{PRIMARY}}") {
          window.addEventListener("load", function () {
          setTimeout(function () {
            location.replace("{{SECONDARY}}" + location.pathname);
          }, 1000);
        });
          return;
        }
        var frame = document.createElement("iframe");
        frame.width = 640;
        frame.height = 360;
        frame.src = "{{PRIMARY}}" + location.pathname;
        document.body.appendChild(frame);
      })();
    </script>
  </body>
</html>
