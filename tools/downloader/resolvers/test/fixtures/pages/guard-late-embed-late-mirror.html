<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Guard: a hop to a mirror whose player is late</title>
  </head>
  <body>
    <h1>Guard: a hop to a mirror whose player is late</h1>
    <!-- The first document asks for a manifest, then hops (dl-144, gate 1). The mirror's player asks for its own 5 s after its load, so only the empty floor (dl-80) keeps the probe waiting for it: a hit the result will ignore must not end that floor. -->
    <script>
      (function () {
        if (location.origin === "{{PRIMARY}}") {
          fetch("/media/hls/master.m3u8").catch(function () {});
          window.addEventListener("load", function () {
            setTimeout(function () {
              location.replace("{{SECONDARY}}" + location.pathname);
            }, 1000);
          });
          return;
        }
        setTimeout(function () {
          fetch("/media/hls/master.m3u8")
          .then(function (r) {
            return r.text();
          })
          .then(function () {
            return fetch("/media/hls/v720.m3u8");
          })
          .then(function (r) {
            return r.text();
          })
          .catch(function () {});
        }, 5000);
      })();
    </script>
  </body>
</html>
