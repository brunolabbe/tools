<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Articolo</title>
  </head>
  <body>
    <!-- dl-82 gate 2, row (i): a consent strip in the page's own flow, neither a
         dialog nor fixed nor sticky, whose label comes from ?label=. A label the
         tier pressed before dl-82 ("Accetta") is still pressed; one only dl-82
         added ("Ho capito", "Accetto e continua") is not, because the strip is
         not a container and the whole-frame reach is the old pattern. -->
    <div id="strip" style="padding: 8px; background: #eee">
      Usiamo i cookie.
      <button
        id="strip-button"
        type="button"
        onclick="fetch('/beacon/strip-accepted');document.getElementById('strip').remove();mountPlayer()"
      >
        Accetta
      </button>
    </div>
    <h1>Articolo</h1>
    <div id="player"></div>
    <script>
      var label = new URLSearchParams(location.search).get("label");
      if (label !== null) document.getElementById("strip-button").textContent = label;

      function mountPlayer() {
        fetch("/media/mse/master.m3u8")
          .then(function (r) {
            return r.text();
          })
          .then(function () {
            return fetch("/media/mse/v1080.m3u8");
          })
          .then(function (r) {
            return r.text();
          })
          .then(function () {
            return Promise.all(
              ["/media/mse/init.mp4", "/media/mse/seg-00001.m4s", "/media/mse/seg-00002.m4s"].map(
                function (u) {
                  return fetch(u);
                },
              ),
            );
          })
          .catch(function () {});
        var v = document.createElement("video");
        v.muted = true;
        v.width = 640;
        v.height = 360;
        v.src = URL.createObjectURL(new MediaSource());
        document.getElementById("player").replaceChildren(v);
      }
    </script>
  </body>
</html>
