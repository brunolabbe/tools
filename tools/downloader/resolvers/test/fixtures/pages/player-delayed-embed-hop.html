<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Embed: a landing document that hops to the player's own</title>
  </head>
  <body style="margin: 0; background: #222">
    <!-- dl-143: the first document of the embed behind player-delayed-single.html
         and player-delayed-tabs.html, on the other fixture origin. It loads, holds
         no player, and about 0.6 s later replaces itself with the document that
         has one (player-tabs-embed.html), the way the live embed host sent the
         frame on to a mirror domain after it had loaded. A click in this document
         does nothing, so a probe that stops at the first `load` clicks nothing. -->
    <script>
      setTimeout(function () {
        location.replace("/player-tabs-embed.html");
      }, 600);
    </script>
  </body>
</html>
