<!doctype html>
<!-- dl-83 gate round 1, page "shop-a-bottom-banner" (mode stream), generated from the gate's harness: an 80 px fixed shop banner, "Free delivery on orders over 18 euros" and "Over 18? Buy now". The stream starts on load. Not recognised: the banner blocks nothing. Every press reports to a /beacon/ path. -->
<html lang="en"><head><meta charset="utf-8"><title>Shop a</title></head>
<body style="margin:0;font-family:sans-serif">
<div id="player" class="player" style="width:640px;height:360px;background:#222"></div><div style="position:fixed;bottom:0;left:0;right:0;height:80px;background:#ffd;z-index:10">
<span>Free delivery on orders over 18 euros.</span> <a href="/dest/checkout.html" id="buy">Over 18? Buy now</a></div>
<script>
function beacon(n){fetch('/beacon/'+n).catch(function(){});}
function startStream(){
  var v=document.createElement('video'); v.muted=true; v.width=640; v.height=360;
  fetch('/media/mse/master.m3u8').then(function(r){return r.text();})
    .then(function(){return fetch('/media/mse/v1080.m3u8');})
    .then(function(r){return r.text();})
    .then(function(){return Promise.all(['/media/mse/init.mp4','/media/mse/seg-00001.m4s','/media/mse/seg-00002.m4s'].map(function(u){return fetch(u);}));})
    .catch(function(){});
  var ms=new MediaSource(); v.src=URL.createObjectURL(ms);
  document.getElementById('player').replaceChildren(v);
}

startStream();

document.getElementById('buy').addEventListener('click',function(){beacon('buy');});
</script></body></html>
