<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A player that starts on its own, above a grid of related-video cards</title>
  </head>
  <body style="margin: 0">
    <!-- dl-81 gate 2: the page requests its stream as it loads, so a stream is
         captured before the input pass, and there is no play control to press.
         Below, a 1000x500 `related-players` wrapper (the largest player-ish box)
         of 3x3 cards that navigate by script: the middle of the wrapper is the
         middle card. Once a stream is captured the centre click must not be made,
         and a click here leaves the page. The card targets are built from the
         card's index, not read from an attribute. -->
    <div class="related-players" style="
        width: 1000px;
        height: 500px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
      ">
      <div class="card" style="background: #ccc">1</div>
      <div class="card" style="background: #ccc">2</div>
      <div class="card" style="background: #ccc">3</div>
      <div class="card" style="background: #ccc">4</div>
      <div class="card" style="background: #ccc">5</div>
      <div class="card" style="background: #ccc">6</div>
      <div class="card" style="background: #ccc">7</div>
      <div class="card" style="background: #ccc">8</div>
      <div class="card" style="background: #ccc">9</div>
    </div>
    <script>
      fetch("/media/hls/master.m3u8")
        .then(function (r) {
          return r.text();
        })
        .catch(function () {});
      document.querySelectorAll(".card").forEach(function (card, index) {
        card.addEventListener("click", function () {
          fetch("/beacon/card-clicked").catch(function () {});
          location.href = "/other-" + String(index + 1) + ".html";
        });
      });
    </script>
  </body>
</html>
