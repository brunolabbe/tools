<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Guard: a navigation that never commits, then a rewrite</title>
  </head>
  <body>
    <h1>Guard: a navigation that never commits, then a rewrite</h1>
    <!-- The page fetches its manifest, starts a top-frame navigation that is answered 204 and so never commits, then rewrites its own URL (dl-144, gate 3). No document was left, so none of its hits are. -->
    <script>
      (function () {
        fetch("/media/hls/master.m3u8")
          .then(function (r) {
            return r.text();
          })
          .then(function () {
            return fetch("/media/hls/v720.m3u8");
          })
          .then(function (r) {
            return r.text();
          })
          .catch(function () {});
        window.addEventListener("load", function () {
          setTimeout(function () {
            location.href = "/beacon/nocommit";
          }, 1000);
        });
        window.addEventListener("load", function () {
          setTimeout(function () {
            history.replaceState(null, "", location.pathname + "?v=2");
          }, 1400);
        });
      })();
    </script>
  </body>
</html>
