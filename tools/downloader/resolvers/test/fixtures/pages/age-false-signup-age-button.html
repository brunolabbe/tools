<!doctype html>
<!-- dl-83 gate round 1, page "signup-c-dropdown" (mode stream), generated from the gate's harness: a sign-up layer whose custom <button> reads "Age: 18". The stream starts on load. Accepted residue: the button is pressed, and the stream is still found. Every press reports to a /beacon/ path. -->
<html lang="en"><head><meta charset="utf-8"><title>Sign up c</title></head>
<body style="margin:0;font-family:sans-serif">
<div id="player" class="player" style="width:640px;height:360px;background:#222"></div><div style="position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6)"><div style="width:420px;padding:24px;background:#fff;color:#000">
<p>You must be 18 or older to sign up.</p>
<button type="button" id="ageb" aria-haspopup="listbox">Age: 18</button></div></div>
<script>
function beacon(n){fetch('/beacon/'+n).catch(function(){});}
function startStream(){
  var v=document.createElement('video'); v.muted=true; v.width=640; v.height=360;
  fetch('/media/mse/master.m3u8').then(function(r){return r.text();})
    .then(function(){return fetch('/media/mse/v1080.m3u8');})
    .then(function(r){return r.text();})
    .then(function(){return Promise.all(['/media/mse/init.mp4','/media/mse/seg-00001.m4s','/media/mse/seg-00002.m4s'].map(function(u){return fetch(u);}));})
    .catch(function(){});
  var ms=new MediaSource(); v.src=URL.createObjectURL(ms);
  document.getElementById('player').replaceChildren(v);
}

startStream();

document.getElementById('ageb').addEventListener('click',function(){beacon('age-dropdown');});
</script></body></html>
