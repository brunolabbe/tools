<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Guard: a player frame</title>
  </head>
  <body>
    <h1>Guard: a player frame</h1>
    <!-- Asks for its manifest on load, with no click (dl-144, gate 2). -->
    <script>
      (function () {
        fetch("/media/hls/master.m3u8")
          .then(function (r) {
            return r.text();
          })
          .then(function () {
            return fetch("/media/hls/v720.m3u8");
          })
          .then(function (r) {
            return r.text();
          })
          .catch(function () {});
      })();
    </script>
  </body>
</html>
