<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A Play-labelled poster above a grid of related-video cards</title>
  </head>
  <body style="margin: 0">
    <!-- dl-81 gate 1: the poster is a 640x360 player with a labelled Play
         button that fetches the stream without mounting a `<video>`. Below it,
         a 1000x500 `related-players` wrapper (larger than the poster, so the
         largest player-ish box) holds cards that navigate by script. The grid
         is 3x3 so that the middle of the wrapper is the middle card; an even
         number of rows leaves a gap there. Pass 0 starts the stream through the
         label; a centre click on the wrapper after that would press a card and
         leave the page. -->
    <div
      class="player-poster"
      style="width: 640px; height: 360px; background: #222; position: relative"
    >
      <button id="play" aria-label="Play" style="position: absolute; left: 10px; bottom: 10px">
        Play
      </button>
    </div>
    <div
      class="related-players"
      style="
        width: 1000px;
        height: 500px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
      "
    >
      <div class="card" data-to="/other-1.html" style="background: #ccc">Next video 1</div>
      <div class="card" data-to="/other-2.html" style="background: #ccc">Next video 2</div>
      <div class="card" data-to="/other-3.html" style="background: #ccc">Next video 3</div>
      <div class="card" data-to="/other-4.html" style="background: #ccc">Next video 4</div>
      <div class="card" data-to="/other-5.html" style="background: #ccc">Next video 5</div>
      <div class="card" data-to="/other-6.html" style="background: #ccc">Next video 6</div>
      <div class="card" data-to="/other-7.html" style="background: #ccc">Next video 7</div>
      <div class="card" data-to="/other-8.html" style="background: #ccc">Next video 8</div>
      <div class="card" data-to="/other-9.html" style="background: #ccc">Next video 9</div>
    </div>
    <script>
      var started = false;
      document.getElementById("play").addEventListener("click", function () {
        if (started) return;
        started = true;
        fetch("/media/hls/master.m3u8")
          .then(function (r) {
            return r.text();
          })
          .catch(function () {});
      });
      document.querySelectorAll(".card").forEach(function (card) {
        card.addEventListener("click", function () {
          fetch("/beacon/card-clicked").catch(function () {});
          location.href = card.getAttribute("data-to");
        });
      });
    </script>
  </body>
</html>
