<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>An icon-only play control above a grid of related-video cards</title>
  </head>
  <body style="margin: 0">
    <!-- dl-100 gate 1: player-poster-related-grid.html with the Play button's
         markup chosen by ?ctl=, and no aria-label or text a label rule could read:
         camel-testid - data-testid="videoPlayButton"
         camel-title  - title="VideoPlay"
         label        - aria-label="Play" (the control for the harness)
         The press starts the stream after ?delay= ms, as a player that loads a
         script first does, so only the press says a player was started; a centre
         click on the larger related-players wrapper would press a card and leave
         the page. The card target is built from the card's index, not read from
         an attribute (see player-poster-related-grid.html). -->
    <div
      class="player-poster"
      style="width: 640px; height: 360px; background: #222; position: relative"
    >
      <span id="slot"></span>
    </div>
    <div
      class="related-players"
      style="
        width: 1000px;
        height: 500px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
      "
    >
      <div class="card" style="background: #ccc">Next video 1</div>
      <div class="card" style="background: #ccc">Next video 2</div>
      <div class="card" style="background: #ccc">Next video 3</div>
      <div class="card" style="background: #ccc">Next video 4</div>
      <div class="card" style="background: #ccc">Next video 5</div>
      <div class="card" style="background: #ccc">Next video 6</div>
      <div class="card" style="background: #ccc">Next video 7</div>
      <div class="card" style="background: #ccc">Next video 8</div>
      <div class="card" style="background: #ccc">Next video 9</div>
    </div>
    <script>
      var params = new URLSearchParams(location.search);
      var ctl = params.get("ctl") || "label";
      var delay = Number(params.get("delay") || 0);
      var button = document.createElement("button");
      button.style.cssText = "position: absolute; left: 10px; bottom: 10px; width: 40px; height: 40px";
      button.textContent = "▶";
      if (ctl === "label") button.setAttribute("aria-label", "Play");
      if (ctl === "camel-testid") button.setAttribute("data-testid", "videoPlayButton");
      if (ctl === "camel-title") button.setAttribute("title", "VideoPlay");
      document.getElementById("slot").appendChild(button);
      var started = false;
      button.addEventListener("click", function () {
        if (started) return;
        started = true;
        setTimeout(function () {
          fetch("/media/hls/master.m3u8")
            .then(function (r) {
              return r.text();
            })
            .catch(function () {});
        }, delay);
      });
      var cards = document.querySelectorAll(".card");
      cards.forEach(function (card, index) {
        card.addEventListener("click", function () {
          fetch("/beacon/card-clicked").catch(function () {});
          location.href = "/other-" + String(index + 1) + ".html";
        });
      });
    </script>
  </body>
</html>
