<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cross-origin card: inner</title>
  </head>
  <body>
    <!-- A related-video "card" wired by a JS onclick, not an `<a href>` — the
         link-ancestor rule does not exclude it. First in the DOM, and smaller
         than the player: only the largest-area rule, run in this
         cross-origin frame, picks correctly (dl-55, decision 3). -->
    <div id="card" onclick="location.assign('/related-card-target.html')">
      <video width="150" height="100" muted playsinline></video>
    </div>

    <!-- The real player: larger, second in the DOM, started only by a
         `click` DOM event. -->
    <video id="player" width="640" height="360" muted playsinline></video>
    <p id="status">idle</p>

    <script>
      (function () {
        var started = false;
        function start() {
          if (started) return;
          started = true;
          document.getElementById("status").textContent = "loading";
          fetch("/media/related/master.m3u8")
            .then(function (r) {
              return r.text();
            })
            .then(function () {
              return fetch("/media/related/v720.m3u8");
            })
            .then(function () {
              document.getElementById("status").textContent = "playing";
            })
            .catch(function () {});
        }
        document.getElementById("player").addEventListener("click", start);
      })();
    </script>
  </body>
</html>
