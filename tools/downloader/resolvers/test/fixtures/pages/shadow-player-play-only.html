<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shadow-root player, play() only</title>
  </head>
  <body>
    <h1>Shadow-root player, play() only</h1>
    <!-- Same shape as shadow-player.html, but the media starts only on
         `.play()` — there is no `click` listener anywhere on the page. Only
         `PLAY_SCRIPT`'s blanket `.play()` attempt, run through a
         shadow-piercing walk, can start it (dl-68). -->
    <div id="host"></div>
    <p id="status">idle</p>

    <script>
      (function () {
        var root = document.getElementById("host").attachShadow({ mode: "open" });
        root.innerHTML = '<video id="sv" width="640" height="360" muted playsinline></video>';
        var started = false;
        function start() {
          if (started) return;
          started = true;
          document.getElementById("status").textContent = "loading";
          fetch("/media/related/master.m3u8")
            .then(function (r) {
              return r.text();
            })
            .then(function () {
              return fetch("/media/related/v720.m3u8");
            })
            .then(function () {
              document.getElementById("status").textContent = "playing";
            })
            .catch(function () {});
        }
        root.getElementById("sv").addEventListener("play", start);
      })();
    </script>
  </body>
</html>
