<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Articolo</title>
  </head>
  <body>
    <h1>Articolo</h1>
    <div id="player"></div>
    <!-- dl-82 gate 2, the case the consent-wording rule gives up: a fixed consent
         bar whose text names neither cookies nor consent ("we value your
         privacy" and nothing else), with a label from ?label=. A label only dl-82
         added ("Ho capito") is not pressed, because the bar is not recognised as a
         container; one the old pattern knew ("Accetta") still is, through the
         whole-frame reach, as it was before dl-82. -->
    <div
      id="bar"
      style="position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 12px; background: #eee"
    >
      Teniamo alla tua privacy.
      <button
        id="bar-button"
        type="button"
        onclick="fetch('/beacon/bar-accepted');document.getElementById('bar').remove();mountPlayer()"
      >
        Accetta
      </button>
    </div>
    <script>
      var label = new URLSearchParams(location.search).get("label");
      if (label !== null) document.getElementById("bar-button").textContent = label;

      function mountPlayer() {
        fetch("/media/mse/master.m3u8")
          .then(function (r) {
            return r.text();
          })
          .then(function () {
            return fetch("/media/mse/v1080.m3u8");
          })
          .then(function (r) {
            return r.text();
          })
          .then(function () {
            return Promise.all(
              ["/media/mse/init.mp4", "/media/mse/seg-00001.m4s", "/media/mse/seg-00002.m4s"].map(
                function (u) {
                  return fetch(u);
                },
              ),
            );
          })
          .catch(function () {});
        var v = document.createElement("video");
        v.muted = true;
        v.width = 640;
        v.height = 360;
        v.src = URL.createObjectURL(new MediaSource());
        document.getElementById("player").replaceChildren(v);
      }
    </script>
  </body>
</html>
