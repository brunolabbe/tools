<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Checkout</title>
  </head>
  <body>
    <h1>Checkout</h1>
    <div id="player"></div>
    <!-- dl-82 gate 2, row (ii): a checkout bar docked to the viewport, fixed by
         default or sticky with ?sticky, with a submit button labelled with a
         phrasing dl-82 added. Its text says nothing of cookies or consent, so it
         is not a consent container and the submit must not be pressed. -->
    <div style="height: 400px"></div>
    <form
      id="bar"
      onsubmit="event.preventDefault()"
      style="position: fixed; left: 0; right: 0; bottom: 0; background: #ddd; padding: 8px"
    >
      By ordering you accept our terms.
      <button type="submit" onclick="fetch('/beacon/checkout-submit')">Agree and continue</button>
    </form>
    <div style="height: 2000px"></div>
    <script>
      var params = new URLSearchParams(location.search);
      var bar = document.getElementById("bar");
      if (params.has("sticky")) bar.style.position = "sticky";
      // dl-82 gate 3: ?text= replaces the bar's sentence and ?label= the
      // submit button's label, to put a word the wording rule may take for
      // consent next to a submit.
      var text = params.get("text");
      if (text !== null) bar.firstChild.nodeValue = text + " ";
      var label = params.get("label");
      if (label !== null) bar.querySelector("button").textContent = label;
    </script>
  </body>
</html>
