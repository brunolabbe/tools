<!doctype html>
<!--

    <div class="receipt">

      <div class="center">2026-10-31 09:47</div>

      <div class="row"><span>TVQ 9,975%</span><span>0,90</span></div>

      <div class="center">FP = TAXABLE TPS/TVQ</div>
      <div class="center">MERCI DE VOTRE VISITE</div>
