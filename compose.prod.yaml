# The host's production overlay: the Cloudflare Tunnel, and the network the
# tools share behind it. **It names no tool, and that is the point.**
#
#   cp .env.prod.example .env     # then fill in TUNNEL_TOKEN
#   docker compose -f compose.downloader.yaml -f compose.prod.yaml \
#                  -f compose.downloader.prod.yaml up -d
#
# or, once `COMPOSE_FILE` is set in `.env`, a bare `docker compose up -d`.
#
# `docs/adr/004-one-compose-fragment-per-tool.md` is why this file holds so
# little. A `downloader:` or `planner:` block here would be a service
# *definition* — an image and a network are enough to start one — so any host
# that merged the shared overlay would stand up a tool it never named. What is
# left is what belongs to the **host**: one tunnel, and one network. Each tool's
# released image, its `TRUST_PROXY`, and its entry in `cloudflared`'s
# `depends_on` live in `compose.<tool>.prod.yaml`, which is the file a host
# merges to say it runs that tool.
#
# `cloudflared` dials *out* to Cloudflare and receives requests back over that
# connection. The host opens no inbound port, needs no static address, and works
# behind CGNAT. The loopback ports the tools bind stay, but they are for
# debugging from the host — they are not how anything is served.
#
# The Cloudflare half — hostname, certificate, access policy — is not in this
# file, because it lives in the dashboard. See docs/02-DEPLOYMENT.md.

# Every fragment in this repo sets the same project name, which is what makes
# any merge of them one compose project. Left unset, compose names the project
# after the basename of the directory the host cloned into and the volumes are
# filed under a name nobody chose. See `compose.downloader.yaml`'s note, and
# docs/02-DEPLOYMENT.md for the migration onto this name.
name: webtools

services:
  cloudflared:
    # Pin this to a release tag once one is known good: `latest` means a
    # `docker compose pull` can change the binary under a working deployment.
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    networks: [edge]

    # `--no-autoupdate` because the in-place updater replaces the running binary
    # and restarts it underneath the container supervisor, which shows up as an
    # unexplained blip rather than as an update. New versions arrive by pulling
    # a new image, on purpose, at a time of your choosing.
    command: ["tunnel", "--no-autoupdate", "run"]

    environment:
      # The entire tunnel configuration — credentials, hostnames, routes — is
      # inside this one token. It is a credential in the full sense: anyone
      # holding it can publish traffic as this tunnel. It belongs in `.env`,
      # which is gitignored, and nowhere else. Never in this file.
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env - see docs/02-DEPLOYMENT.md}"

    # There is deliberately no `depends_on` here. It is not that the tunnel does
    # not need one — it is that this file cannot know which tools this host
    # runs, and each tool's prod fragment adds its own entry.

    # It relays TCP and terminates nothing. Left unbounded it is invisible in
    # `docker stats`; bounded, a runaway is attributable.
    deploy:
      resources:
        limits:
          memory: 256m

networks:
  edge:
    ipam:
      config:
        # Fixed, so the `TRUST_PROXY` settings can name it. If this collides
        # with a subnet already on the host, change it here and everywhere it is
        # named — `compose.downloader.prod.yaml`'s `TRUST_PROXY` and
        # `compose.planner.prod.yaml`'s. It is one setting written three times,
        # and a mismatch in either of them silently reverts that tool's rate
        # limit to sharing a single bucket rather than refusing to boot.
        - subnet: 172.30.42.0/24
