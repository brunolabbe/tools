name: planner

# This tool's slow gate: the image that ships it.
#
# It exists so that the first time the planner's container is built is not the
# day it is released. `release.yml` pushes to a registry from a tag, and a
# Dockerfile that has never been exercised fails there — after the version is
# cut and the changelog is written, which is the worst moment to discover a
# missing manifest or a native module that will not compile.
#
# Path-filtered, so downloader work does not pay for it. `packages/**` is
# included deliberately: this image is built on `@webtools/core`, so a change
# there can break it without touching a planner file.
#
# `push` is `main` only. See the note in `ci.yml`: a branch with an open pull
# request fires both events into separate concurrency groups, so it used to pay
# twice for the same answer.
on:
  push:
    branches: [main]
    paths:
      - "tools/planner/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/planner.yml"
      # Last, so it overrides the globs above — `tools/planner/**` otherwise
      # pulls this tool's own `docs/` in. See the note in `ci.yml`.
      - "!**.md"
  pull_request:
    paths:
      - "tools/planner/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/planner.yml"
      # Last, so it overrides the globs above — `tools/planner/**` otherwise
      # pulls this tool's own `docs/` in. See the note in `ci.yml`.
      - "!**.md"
  # So a failure can be re-run without an empty commit.
  workflow_dispatch:

concurrency:
  group: planner-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The intake and pinning, through a browser, against the bundle the API
  # serves. The unit suites prove each half of both — `inject()` for the server,
  # a faked client for the browser — and neither can prove the two are wired to
  # each other, that a reload resumes, or that a pin reached SQLite rather than
  # React state. See `tools/planner/e2e/README.md`.
  #
  # This job is the *only* place either claim is checked, which is why pl-10's
  # review gate called the pinning row `unproven (gate)` rather than `unproven`
  # — and why pl-19's proof of it is a gate too.
  #
  # Not in `ci.yml`: it costs a browser download and a Vite build, and this file
  # is where the planner's slow gates live, path-filtered so downloader work
  # does not pay for them.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The API under test is started with tsx, which runs its own sources but
      # still resolves `@planner/contract`, `@planner/intake` and
      # `@planner/agent` through their `dist`. The serve script builds `web`,
      # which does not reach all three — without this the API never comes up and
      # Playwright reports a web server that would not start, which reads as an
      # e2e failure rather than as a missing build.
      - run: npm run build
      # No browser cache here, deliberately, and `ci.yml` now caches on Windows
      # only for the same reason. Measured on this runner: restoring 282 MB took
      # three seconds and the install still took eleven, against twenty with no
      # cache at all. Six seconds is not worth a copy per branch out of the
      # repository's 10 GB cache quota — which was over budget, and evicting
      # the caches that do pay for themselves.
      - run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
      # No key and no network: the scripted provider is the default, and the
      # config names it anyway. A red run here is the tool's fault, never a
      # vendor's.
      - run: npm run e2e:planner
      # Traces and video, kept only when something failed — that is the whole
      # reason `trace: retain-on-failure` is set.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: planner-e2e-artifacts
          path: tools/planner/e2e/.artifacts/results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Built and started, not just built. A planner image can compile
      # perfectly and still fail to boot: `better-sqlite3` is a native addon
      # crossing from the build stage's Debian to the runtime stage's slim one,
      # and a mismatch there surfaces at the first query rather than at compile.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tools/planner/Dockerfile
          push: false
          load: true
          tags: planner:ci
          cache-from: type=gha,scope=planner
          # Read always, written only from `main` — see the note in
          # `downloader.yml`. A pull request branch's export is readable from
          # that branch alone, so it was a full copy of the layers written for
          # one build and never read again.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=planner' || '' }}

      - name: Wait for the service to report healthy
        run: |
          set -euo pipefail
          docker run -d --name planner -p 127.0.0.1:8090:8090 planner:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8090/api/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          echo "the service never became healthy"
          docker logs planner
          exit 1

      # The image served no UI at all until pl-13 — `WEB_DIR` was set in the
      # Dockerfile and parsed by `config.ts`, and nothing read it. Health
      # answered perfectly throughout, which is why nothing here noticed. So the
      # page is now asked for, by a client that says it wants one.
      - name: The image serves the UI, not only the API
        run: |
          set -euo pipefail
          curl -fsS -H 'Accept: text/html' http://127.0.0.1:8090/ > /tmp/index.html
          # The bundle's own root element, so an error page or a JSON body
          # cannot satisfy this the way a 200 alone would.
          grep -q '<div id="root">' /tmp/index.html
          # And the API still answers on its own paths, rather than the static
          # plugin having swallowed the prefix.
          curl -fsS http://127.0.0.1:8090/api/health > /dev/null

      - if: always()
        run: docker rm -f planner || true
