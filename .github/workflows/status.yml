name: Status

# Every ticket's frontmatter parses, on every pull request. That is the whole
# workflow: repo-2 retired the generated `03-STATUS.md` pages, so there is no
# artefact to write on `main` and none to guard on a branch — `npm run status`
# computes the view on demand and stores nothing.
#
# This is a workflow of its own rather than a job in `ci.yml`, and that is the
# whole point rather than tidiness. `ci.yml` carries `paths-ignore: ["**.md"]`,
# so a documentation-only pull request — a ticket flipped to `done`, a new
# ticket filed — does not run it at all. That is exactly the pull request whose
# frontmatter needs parsing, so a job there would be silent in the one case it
# exists for.
on:
  pull_request:
    paths:
      # Both ticket directories, named rather than globbed across `docs/`. The
      # filter this replaces was `tools/*/docs/**`, which never matched a
      # repo-wide ticket at all — a pull request that only filed one in
      # `docs/work/` ran no frontmatter check.
      - "docs/work/**"
      - "tools/*/docs/work/**"
      - "scripts/status.mjs"

concurrency:
  group: status-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast, and it needs no build: `status.mjs` has no dependencies for the same
  # reason `commit-message.mjs` does not.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Parses every ticket, and fails by file and line on anything it does not
      # understand — an unknown field, a status outside the taxonomy, an id that
      # disagrees with its filename, a `depends_on` pointing at nothing. Nothing
      # else in CI reads them.
      - run: node scripts/status.mjs --json > /dev/null
