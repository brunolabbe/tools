name: ledger

# This tool's slow gate: the image that ships it.
#
# It exists so that the first time the ledger's container is built is not the
# day it is released. `release.yml` pushes to a registry from a tag, and a
# Dockerfile that has never been exercised fails there — after the version is
# cut and the changelog is written.
#
# Path-filtered, so work on another tool does not pay for it. `packages/**` is
# included deliberately: this image is built on `@webtools/core`, so a change
# there can break it without touching a ledger file.
#
# The `e2e` job arrived with the first spec (repo-109), in the planner's shape:
# every screen at a phone's width and a desktop's — see
# `tools/ledger/e2e/README.md`.
#
# `push` is `main` only. See the note in `ci.yml`: a branch with an open pull
# request fires both events into separate concurrency groups, so it used to pay
# twice for the same answer.
on:
  push:
    branches: [main]
    paths:
      - "tools/ledger/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ledger.yml"
      # Last, so it overrides the globs above — `tools/ledger/**` otherwise
      # pulls this tool's own `docs/` in. See the note in `ci.yml`.
      - "!**.md"
  pull_request:
    paths:
      - "tools/ledger/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ledger.yml"
      # Last, so it overrides the globs above — `tools/ledger/**` otherwise
      # pulls this tool's own `docs/` in. See the note in `ci.yml`.
      - "!**.md"
  # So a failure can be re-run without an empty commit.
  workflow_dispatch:

concurrency:
  # A release merge gets its own group, so it cannot cancel the run of the
  # code merged before it and then skip its own. See the note in `ci.yml`.
  group: "ledger-${{ github.ref }}${{ startsWith(github.event.head_commit.message, 'chore(') && contains(github.event.head_commit.message, '): release ') && '-release' || '' }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The layout spec, through a browser, against the bundle the API serves, over
  # household books it fills through the API. See `tools/ledger/e2e/README.md`.
  # Not in `ci.yml`, for the planner's reason: it costs a browser download and a
  # Vite build, and this file is path-filtered so other tools' work does not pay.
  e2e:
    # Not on a release merge, which re-proves its pull request's tree. See the
    # note in `ci.yml` (repo-142).
    if: "${{ !(startsWith(github.event.head_commit.message, 'chore(') && contains(github.event.head_commit.message, '): release ')) }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The API under test is started with tsx, which runs its own sources but
      # still resolves `@ledger/contract`, `@ledger/books` and `@ledger/receipts`
      # through their `dist`. The serve script builds `web` and the household
      # command builds the API, which does not reach all of them.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
      # No key and no network: the receipt reader is unset, so a receipt is
      # typed in, and nothing here reaches a model.
      - run: npm run e2e:ledger
      # Traces and video, kept only when something failed.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ledger-e2e-artifacts
          path: tools/ledger/e2e/.artifacts/results
          retention-days: 7
      # The layout spec's screenshots, kept on a pass too: a green width
      # assertion over a page nobody has looked at proves little, so the gate
      # opens these.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ledger-layout-shots
          path: tools/ledger/e2e/.artifacts/layout
          retention-days: 7

  docker:
    # Not on a release merge, which re-proves its pull request's tree. See the
    # note in `ci.yml` (repo-142).
    if: "${{ !(startsWith(github.event.head_commit.message, 'chore(') && contains(github.event.head_commit.message, '): release ')) }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Built and started, not just built. `better-sqlite3` is a native addon
      # crossing from the build stage's Debian to the runtime stage's slim one,
      # and a mismatch there surfaces at the first query rather than at compile.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tools/ledger/Dockerfile
          push: false
          load: true
          tags: ledger:ci
          cache-from: type=gha,scope=ledger
          # Read always, written only from `main` — see the note in
          # `downloader.yml`.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=ledger' || '' }}

      - name: Wait for the service to report healthy
        run: |
          set -euo pipefail
          docker run -d --name ledger -p 127.0.0.1:8100:8100 ledger:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8100/api/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          echo "the service never became healthy"
          docker logs ledger
          exit 1

      # The planner's image served no UI at all until pl-13 while health
      # answered perfectly, so the page is asked for by a client that says it
      # wants one.
      - name: The image serves the UI, not only the API
        run: |
          set -euo pipefail
          curl -fsS -H 'Accept: text/html' http://127.0.0.1:8100/ > /tmp/index.html
          # The bundle's own root element, so an error page or a JSON body
          # cannot satisfy this the way a 200 alone would.
          grep -q '<div id="root">' /tmp/index.html
          curl -fsS http://127.0.0.1:8100/api/health > /dev/null

      # The household command, run inside the image the way the deployment
      # notes run it: a second process writing the directory the running API
      # reads (lg-20's gate, F8). The API gives a household its own books file
      # the first time it needs one, and health is one of those times (lg-21).
      - name: The household command runs inside the image, and a household gets its books
        run: |
          set -euo pipefail
          household() { docker exec ledger node tools/ledger/api/dist/household-ledger.js "$@"; }
          # `add` makes the household under a generated UUID and prints it; the
          # steps below name that household by what it printed (lg-71).
          household add ci@example.test ci | tee /tmp/add.txt
          id=$(grep '^Created the household ' /tmp/add.txt | grep -oE '[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}' | head -n 1 || true)
          if [ -z "$id" ]; then
            echo "add printed no household id"
            exit 1
          fi
          household member "$id" someone@example.test someone
          household list | tee /tmp/list.txt
          grep -q 'someone@example.test' /tmp/list.txt
          household remove someone@example.test
          household list | tee /tmp/list.txt
          if grep -q 'someone@example.test' /tmp/list.txt; then
            echo "the removal did not take"
            exit 1
          fi
          curl -fsS http://127.0.0.1:8100/api/health | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          docker exec ledger test -f "/data/households/$id.db"

      - if: always()
        run: docker rm -f ledger || true
