# TEMPORARY (dl-106): runs one test file on windows-latest N times. Deleted before the pull request is ready.
name: dl106-probe

on:
  push:
    branches: [dl-106-parallel-ranges-windows]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      DL106: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: The file, twenty-five times
        shell: bash
        run: |
          git log -1 --format="head %H"
          fails=0
          for i in $(seq 1 25); do
            if npx vitest run tools/downloader/engine/test/parallel-ranges.test.ts > "final-$i.log" 2>&1; then
              echo "final $i: PASS"
            else
              echo "final $i: FAIL"
              fails=$((fails + 1))
              sed "s/\x1b\[[0-9;]*m//g" "final-$i.log" | grep -aE "( FAIL |AssertionError)" | cut -c1-300 | head -20 || true
              echo "--- DL106 lines of failed run $i"
              sed "s/\x1b\[[0-9;]*m//g" "final-$i.log" | grep -aE "DL106" | cut -c1-420 | head -400 || true
              echo "--- end"
            fi
            grep -a "DL106 F9R2" "final-$i.log" | cut -c1-300 || true
          done
          echo "failed runs: $fails of 25"
