# TEMPORARY (dl-106): runs one test file on windows-latest N times. Deleted before the pull request is ready.
name: dl106-probe

on:
  push:
    branches: [dl-106-parallel-ranges-windows]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      DL106: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: The cancel test, 25 times on the old pacing
        shell: bash
        run: |
          git checkout bba22382 -- tools/downloader/engine/test/parallel-ranges.test.ts
          # the old file has no CANCEL print; the assertion is what is read
          fails=0
          for i in $(seq 1 25); do
            if npx vitest run tools/downloader/engine/test/parallel-ranges.test.ts -t "a cancel after the first byte" > "old-$i.log" 2>&1; then :; else
              fails=$((fails + 1))
              sed "s/\x1b\[[0-9;]*m//g" "old-$i.log" | grep -aE "( FAIL |AssertionError)" | cut -c1-300 | head -5 || true
            fi
          done
          echo "old pacing, cancel test: $fails of 25 failed"
          git checkout HEAD -- tools/downloader/engine/test/parallel-ranges.test.ts
      - name: The cancel test, 25 times on the bucket
        shell: bash
        run: |
          fails=0
          for i in $(seq 1 25); do
            if npx vitest run tools/downloader/engine/test/parallel-ranges.test.ts -t "a cancel after the first byte" > "new-$i.log" 2>&1; then :; else
              fails=$((fails + 1))
              sed "s/\x1b\[[0-9;]*m//g" "new-$i.log" | grep -aE "( FAIL |AssertionError)" | cut -c1-300 | head -5 || true
            fi
            grep -a "DL106 CANCEL" "new-$i.log" | cut -c1-600 || true
          done
          echo "bucket pacing, cancel test: $fails of 25 failed"
