name: downloader

# The slow gates: the whole stack in a browser, and the container that ships it.
# Split out of `ci.yml` and filtered by path so that work on another tool does
# not spend ten minutes generating HLS fixtures with ffmpeg to prove something
# about code it never touched. Lint, typecheck and the unit suites still run for
# every change — those are in `ci.yml` and are not filtered.
#
# The filter deliberately includes `packages/**`: everything here sits on top of
# `@webtools/core`, so a change there can break this tool without touching it.
#
# `push` is `main` only. See the note in `ci.yml`: a branch with an open pull
# request fires both events into separate concurrency groups, so it used to pay
# twice for the same answer.
on:
  push:
    branches: [main]
    paths:
      - "tools/downloader/**"
      - "packages/**"
      - "compose.yaml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/downloader.yml"
  pull_request:
    paths:
      - "tools/downloader/**"
      - "packages/**"
      - "compose.yaml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/downloader.yml"
  # So a failure can be re-run without an empty commit.
  workflow_dispatch:

concurrency:
  group: downloader-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The whole stack in one piece: real UI, real API, real ffmpeg, real file.
  # Linux only — it is the slowest job and the thing it proves is not
  # platform-specific.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The API under test is started with tsx, which runs its own sources but
      # still resolves `@downloader/engine` and friends through their `dist`.
      # Without this the fixture server never comes up and Playwright reports a
      # web server that would not start, which reads as an e2e failure.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
      # See the note in ci.yml: the bundled `ffmpeg-static` binary segfaults on
      # this runner, which here shows up as a download that never reaches
      # "Ready" rather than as an error.
      - name: Use the distribution's ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          echo "FFMPEG_PATH=/usr/bin/ffmpeg" >> "$GITHUB_ENV"
      - run: npm run e2e:downloader
      # Traces and video, kept only when something failed — that is the whole
      # reason `trace: retain-on-failure` is set.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts
          path: tools/downloader/e2e/.artifacts/results
          retention-days: 7

  # `docker compose up` from a clean machine is the M4 acceptance criterion, so
  # it is checked rather than assumed. Builds the image and waits for the
  # service's own health endpoint to report ready.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Through buildx with a registry-backed layer cache rather than a bare
      # `docker compose build`, which starts from nothing every run. `planner`
      # has had this from the start; this job was paying ~2.3 minutes to rebuild
      # layers that had not changed. `compose up` then finds the image by tag
      # and starts it without building.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/downloader/Dockerfile
          push: false
          load: true
          # The tag and the build arg both have to match `compose.yaml`, or the
          # `--no-build` below starts something other than what was just built.
          tags: downloader:local
          build-args: INSTALL_YTDLP=false
          cache-from: type=gha,scope=downloader
          cache-to: type=gha,mode=max,scope=downloader
      - run: docker compose up -d --no-build
      - name: Wait for the service to report healthy
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 5
          done
          echo "the service never became healthy"
          docker compose logs
          exit 1
      - if: always()
        run: docker compose down -v
