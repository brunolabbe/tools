name: pr-title

# This repo merges with merge commits, so the commits on the branch are what
# land on `main` and what release-please reads. That makes `.githooks/commit-msg`
# the gate for the changelog, and this check something else: the title is the
# line a human reads in the pull request list and in a release's commit range,
# and holding it to the same rule keeps that list legible.
#
# It is worth having anyway because the hook fails open — a contributor without
# node on PATH commits whatever they like — and a bad title is the tell.
#
# The rule is the same one `.githooks/commit-msg` enforces locally, from the
# same file, so the two cannot drift.

on:
  pull_request:
    # `edited` matters more than it looks: a title fixed after a red check has
    # to turn the check green without an empty commit to re-trigger it.
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # No `setup-node`, no `npm ci`: the validator is dependency-free `.mjs`
      # and the runner already has a node. This job answers in seconds.
      - uses: actions/checkout@v7
      - name: Check the pull request title
        env:
          # Through the environment rather than an expression, so a title
          # containing quotes or backticks is data and never shell syntax.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/commit-message.mjs --text "$PR_TITLE"
