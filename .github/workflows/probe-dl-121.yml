name: probe-dl-121

# DO NOT MERGE. A measurement for dl-121, on a branch that is closed once the
# reading is captured. Loops the one 3x parallel-ranges test on windows-latest
# and prints singleMs, splitMs and the ratio for every pass, which the real test
# only prints when it fails. The test file is copied and given one console.log
# before its assertion, so the assertion itself is the ref's own.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  loop:
    name: loop (${{ matrix.label }}, ${{ matrix.mode }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              label: before-07acbb86,
              ref: 07acbb8605d6ad11bba42c26b7f2f724f8c0829d,
              mode: one,
              loops: 30,
            }
          - {
              label: main-8e49523c,
              ref: 8e49523c8e7d6fc8fada32736212c6b1e3146316,
              mode: one,
              loops: 30,
            }
          # What CI does: the whole engine package at once, so the test shares the
          # machine with its sibling files. The copy replaces the original.
          - {
              label: main-8e49523c,
              ref: 8e49523c8e7d6fc8fada32736212c6b1e3146316,
              mode: pkg,
              loops: 4,
            }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @downloader/engine
      - name: Copy the test with a print before its assertion
        shell: bash
        run: |
          set -eu
          dir=tools/downloader/engine/test
          sed 's|^\( *\)expect(single.ms / split.ms, timing)|\1console.log("RATIO", timing, single.ms / split.ms);\n&|' \
            "$dir/parallel-ranges.test.ts" > "$dir/parallel-ranges-probe.test.ts"
          grep -n 'console.log("RATIO"' "$dir/parallel-ranges-probe.test.ts"
          git rev-parse HEAD
          node --version
          echo "cores: $NUMBER_OF_PROCESSORS"
      - name: Loop
        shell: bash
        run: |
          dir=tools/downloader/engine/test
          for i in $(seq 1 ${{ matrix.loops }}); do
            if [ "${{ matrix.mode }}" = one ]; then
              npx vitest run "$dir/parallel-ranges-probe.test.ts" -t "finishes at least 3x faster" > "run-$i.log" 2>&1
            else
              npx vitest run tools/downloader/engine --exclude "**/node_modules/**" --exclude "**/dist/**" --exclude "**/parallel-ranges.test.ts" > "run-$i.log" 2>&1
            fi
            code=$?
            line=$(grep -h 'RATIO' "run-$i.log" | head -1 || true)
            echo "RUN $i exit=$code $line"
            if [ "$code" != 0 ]; then
              grep -E "FAIL|AssertionError|expected" "run-$i.log" | head -5 || true
            fi
          done
