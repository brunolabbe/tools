name: security

# Static analysis and dependency screening. Both of these are free on a public
# repository and cost money on a private one, which is the only reason this
# file did not exist earlier — not a judgement that the repo did not need them.
#
# The fit here is better than average. This codebase spends most of its risk
# budget on three things CodeQL's taint tracking reads well: URLs a user
# influenced reaching a fetch (SSRF), user strings reaching a subprocess
# argument, and credentials reaching a log line. The last two are currently
# policed by `packages/core/test/spawn-safety.test.ts` and by review, which is a
# source scan and a habit respectively — neither follows a value across a
# function boundary.
on:
  push:
    branches: [main]
  pull_request:
  # Weekly, because CodeQL's queries improve without this repo changing. A
  # finding can appear in code that has been still for a month.
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The only reason this workflow needs more than `contents: read`: the
      # results are uploaded to the repository's code-scanning alerts.
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          # One language covers the repo — `javascript-typescript` analyses
          # both, and there is nothing compiled here.
          languages: javascript-typescript
          # `security-and-quality` adds maintainability queries that are noisy
          # on a codebase this size; the default `security-extended` is the
          # signal worth reading.
          queries: security-extended
          # The query that turns a `// codeql[<rule-id>]` comment into a SARIF
          # `suppressions[]` entry, which is the input the dismissal step below
          # reads. It is not in `security-extended`: that suite selects kinds
          # `problem`, `path-problem`, `diagnostic` and `metric`, and
          # `AlertSuppression.ql` is `@kind alert-suppression`. Without this
          # line the SARIF carries no suppressions at all and the step below is
          # inert — the adr/005 comments would still document a finding for a
          # human reader and still not clear the check. `packs` and `queries`
          # are combined rather than exclusive; `packs` is only available in a
          # single-language analysis, which this is.
          packs: codeql/javascript-queries:AlertSuppression.ql
      # No build step. The JS/TS extractor reads source directly, so it does not
      # need `npm ci` or a populated `dist` the way the suites in `ci.yml` do.
      - uses: github/codeql-action/analyze@v4
        # `id:` so the step below can read `sarif-output` (the absolute path to
        # the directory `output` defaults to, `../results`) and `sarif-id` (the
        # upload the dismissal waits on) rather than hard-coding a path.
        id: analyze
        with:
          category: /language:javascript-typescript
      # Under adr/005 the inline `// codeql[<rule-id>]` comment is a register,
      # not a dismissal: it does not clear the check on its own, so a pull
      # request touching an excused file still gets a red `CodeQL` check.
      # (Whether GitHub would act on a SARIF suppression by itself is *not*
      # established — until the line above, this repo never produced one. See
      # adr/005, "What the merge showed".)
      #
      # This step closes the gap regardless — it splits the uploaded SARIF by
      # whether `suppressions[]` is non-empty, matches results to alerts by rule
      # id, file, line and column, and PATCHes the suppressed ones to dismissed.
      # It also re-opens an alert it previously dismissed whose suppression has
      # gone, which is what makes deleting a comment mean something.
      #
      # The cost, named rather than discovered later: it dismisses with fixed
      # text — reason "won't fix", comment "Suppressed via SARIF". adr/005's
      # five fields of justification live only in the code comment, so the
      # security tab's record of the decision is uninformative on its own.
      #
      # Pinned to a commit SHA, and it is the only such pin in this directory —
      # every other action reference here is tag-pinned (34 of them, 12 distinct
      # actions, measured 2026-09-07). A step holding `security-events: write`
      # is pinned harder than the rest, because this one writes alert state: a
      # compromised release could
      # dismiss real alerts silently and nothing in this repo would notice. The
      # pin is `v2.0.3`, resolved with `git ls-remote --tags`; see repo-16.
      #
      # Push-to-`main` only. A dismissal is repository-global, so a pull request
      # that adds a suppression must not be able to dismiss an alert for
      # everybody before it merges.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: advanced-security/dismiss-alerts@a18f986bdb40edba0dd7a74382c15d4a3d50a1c8 # v2.0.3
        with:
          sarif-id: ${{ steps.analyze.outputs.sarif-id }}
          sarif-file: ${{ steps.analyze.outputs.sarif-output }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Blocks a known-vulnerable dependency at the pull request rather than at
  # whatever later moment someone runs `npm audit`. Pull requests only — there
  # is no "changed dependencies" to diff on a push to `main` or on a schedule.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          # Moderate rather than low: this repo pulls a large transitive tree
          # through Playwright and ffmpeg, and a gate that cries at every
          # advisory is a gate people learn to click past.
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
