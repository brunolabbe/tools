name: CI

# `push` is `main` only, deliberately. A branch with an open pull request fires
# both events, and because the two carry different `github.ref` values their
# concurrency groups do not collide — so every commit used to buy two identical
# runs. The pull request is the one that gates the merge; the `main` push is the
# one that records the merged state. A branch with no pull request open yet is
# not worth a runner.
#
# **Markdown is no longer skipped, and the reason it was skipped is the reason
# it must not be.** The triggers carried `paths-ignore: ["**.md"]`, on the
# argument below. That argument was about cost and it was measured — `d97db2c`
# edited `docs/01-TICKETS.md` and nothing else, and bought five minutes and
# fifty-four seconds of Linux and Windows suites for it. Appending to a ticket's
# Log when work finishes is a standing rule in CLAUDE.md, so documentation-only
# commits are routine here, not rare. All of that still holds. What it never
# justified is skipping `check`: `npm run check` runs `oxfmt --check`, and
# **oxfmt formats markdown in this repository** — `.oxfmtrc.json` has to name
# `**/CHANGELOG.md` in `ignorePatterns` precisely because it does. So a
# documentation-only pull request could break `npm run check` with nothing in CI
# to catch it. It merged green-because-skipped, and the next pull request to
# touch code went red for a reason that had nothing to do with it. Not
# hypothetical: oxfmt reflowed a wrapped `> 0` into a blockquote in `dl-18`,
# caught only because an agent ran `format` locally.
#
# So the measurement keeps its conclusion and loses its blast radius. Five
# minutes fifty-four seconds is the **matrix's** cost; `check` answers in under
# a minute, and `check` is what markdown can break. The triggers no longer
# filter, `check` runs on every event, and the matrix is gated instead by the
# `changes` job below — which reproduces the old `**.md` rule as a diff rather
# than as a trigger filter, because Actions has no per-job `paths`. No `.md` in
# this repository is a test fixture — every one is prose — so nothing the matrix
# runs can depend on one, which is what makes gating the matrix and not `check`
# the right split.
#
# **`push` loses the filter too, and that is a choice rather than symmetry for
# its own sake.** The `main` push is the run that records the merged state, and
# a squash of a documentation-only branch is precisely the merge that could put
# an unformatted `.md` on `main` — a filtered `push` would mean the first run to
# notice is the next unrelated pull request, which is the failure this change
# exists to stop. It costs one sub-minute `check` per docs merge; the matrix
# still skips, because `changes` gates it on both events alike.
#
# **A skipped job cannot leave a pull request pending forever**, and that claim
# had to be re-checked rather than inherited: it used to be about a skipped
# *workflow* and now has to hold for a skipped *job*. The ruleset on `main`
# (`gh api repos/{owner}/{repo}/rulesets`, read 2026-08-23) carries `deletion`,
# `non_fast_forward` and `pull_request` with zero required approvals, and **no
# `required_status_checks` rule at all**; `branches/main/protection` answers
# 404, so there is no classic protection either. If a required check is ever
# added, `test` cannot be one of them under this shape — a required check that
# never reports blocks the merge forever, which is a worse bug than the one this
# replaced.
#
# Release pull requests still run the matrix: release-please touches
# `version.txt` and the manifest alongside the changelog.
on:
  push:
    branches: [main]
  pull_request:
  # Nightly against `main`, because the failures this repo actually hits are
  # environmental and no commit triggers them. The `ffmpeg-static` SIGSEGV
  # documented below appeared when a runner image changed underneath us, not
  # when anyone wrote code; a nightly finds that on a Tuesday instead of during
  # a release. 07:00 UTC — off-peak, and long after the day's work has landed.
  schedule:
    - cron: "0 7 * * *"
  # So a failure can be re-run without an empty commit.
  workflow_dispatch:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The resolver tests never reach a real site, and the browsers they do need
  # come from the job that installs them explicitly.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  # Lint, format and typecheck. Split out because it answers in under a minute
  # and a formatting failure should not wait on a browser download. Unfiltered
  # and ungated on purpose — see the header: this is the job markdown breaks.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # Parses every ticket, and fails by file and line on anything it does not
      # understand — an unknown field, a status outside the taxonomy, an id that
      # disagrees with its filename, a `depends_on` pointing at nothing, a
      # ticket still `ready` with a gate record already on it. Nothing else in
      # CI reads them.
      #
      # **It reads the checkout, not the history.** There is no `fetch-depth`
      # above, so this job gets a depth-1 clone and any check written against
      # `git log` would pass here by seeing nothing — which is why repo-12's
      # check reads the ticket's own body instead of its commits.
      #
      # This lived in a `status.yml` of its own for exactly one reason: `ci.yml`
      # skipped markdown, so the pull requests whose frontmatter needed parsing
      # — a ticket filed, a ticket flipped to `done` — were the ones that never
      # ran it. That reason is gone, so the workflow went with it (repo-2). It
      # needs no build and no dependencies, for the same reason
      # `commit-message.mjs` does not, so it costs this job seconds.
      - run: node scripts/status.mjs --json > /dev/null

  # Which files this change actually touches, because **Actions has no per-job
  # `paths` filter** — `paths-ignore` gates the whole workflow, so the only way
  # to keep `check` unfiltered while the matrix stays cheap is to compute the
  # answer here and have `test` gate on it.
  #
  # The rule is the one the trigger filter expressed: if everything that changed
  # ends in `.md`, the matrix is skipped. Close to the original rather than
  # provably identical to it — GitHub does not document whether its own filter
  # consults a rename's `previous_filename` alongside its `filename`, so that is
  # one case where the two may differ and the claim stops at what can be shown.
  # Written out rather than delegated to a marketplace action, for the same
  # reason `commit-message.mjs` and `status.mjs` are ours — it is a dozen lines,
  # and the alternative is an unpinned third party holding a checkout of the
  # repository.
  #
  # The two events need different diff bases, and anything without one runs the
  # matrix. `schedule` and `workflow_dispatch` have no base at all; a push whose
  # `before` is the all-zero sha is a branch's first push; and a base commit can
  # simply be absent from a rewritten history. Every one of those falls through
  # to `code=true`. **The failure direction is deliberate: not knowing means
  # running the suites, never skipping them**, and the `git cat-file -e` guards
  # are what buys that: without them a degenerate base reaches `git diff`, which
  # is the only path by which a change could be skipped for a reason nobody
  # chose. They are not there to prevent a silent green — a `changes` job that
  # errors sets the run's conclusion to `failure`, so the skipped `test` is red
  # and visible. `set -euo pipefail` is the other half: the first `git diff` is
  # unguarded on purpose, so if git itself fails the job stops there rather than
  # letting the second one's `|| true` turn the failure into an empty `non_md`
  # and a skip.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, or the base commit is not there to diff against.
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ] || [ -z "${HEAD:-}" ] \
            || [ "${BASE}" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null \
            || ! git cat-file -e "${HEAD}^{commit}" 2>/dev/null; then
            echo "No usable diff base for ${GITHUB_EVENT_NAME}; running the matrix."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Three dots: what this change added, not what `main` moved past
          # underneath it — which is the comparison the trigger filter made too.
          #
          # `--no-renames` is load-bearing, not tidiness. Rename detection is on
          # by default and reports a rename as its **destination only**, so
          # `git mv src/foo.ts docs/foo.md` lists `docs/foo.md` and nothing
          # else — every path ends in `.md`, and the matrix skips a change that
          # deleted a TypeScript file. With `--no-renames` the same commit lists
          # both paths and `src/foo.ts` fails the test, which is the answer that
          # matters.
          echo "Changed files, ${BASE}...${HEAD}:"
          git diff --no-renames --name-only "${BASE}...${HEAD}" | sed 's/^/  /'
          non_md="$(git diff --no-renames --name-only "${BASE}...${HEAD}" | grep -v '\.md$' || true)"
          if [ -n "${non_md}" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation only; skipping the matrix. check still ran."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # The unit and integration suites. On both platforms, because this project
  # has a genuine Windows story — but narrower than it looks, and worth naming
  # precisely so nobody deletes the wrong half. `buildTaskkillArgs` and
  # `sanitizeFilename("CON")` are pure functions and answer identically on
  # Linux; their tests are not why this matrix exists. The reason is
  # `hls-e2e.test.ts`'s "cancelling kills the process tree and leaves no
  # artifacts", which has no `skipIf`: on this runner it spawns a real
  # `ffmpeg-static`, takes `killTreeWindows` into a real `taskkill.exe`, and
  # asserts nothing was orphaned. That is the only execution of `taskkillPath()`
  # anywhere, and it pins the process-tree rule in CLAUDE.md.
  #
  # This ran briefly path-filtered to the downloader, on the theory that every
  # Windows hazard is that tool's. It is unfiltered again: the filter was a
  # concession to a Windows minute costing 1.67x a Linux one, and on a public
  # repository it costs nothing. A root `package.json`, a tsconfig or a vitest
  # setting can all change Windows behaviour without touching a downloader
  # path, and a filter that never fires for them is a gap, not a saving.
  #
  # The one filter it does carry is markdown, via `changes` above — the same
  # rule the workflow trigger used to apply to every job at once.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Every workspace is consumed through its `dist` — that is what its
      # package.json `exports` points at — so a tree that has never been built
      # cannot resolve a single cross-package import. Locally this is invisible,
      # because `npm run check` typechecks with `tsc --build` and leaves the
      # output behind; a fresh checkout has nothing.
      - run: npm run build
      # Windows only, and that asymmetry is measured rather than assumed.
      # Downloading Chromium there is minutes; on the Linux runner it is ~20
      # seconds against a CDN, which is less than this step spends restoring
      # 282 MB. A cache that saves six seconds is not free — every branch that
      # touches the lockfile writes its own copy, and the repository's 10 GB
      # cache quota is what pays. Keyed on the lockfile, so a Playwright bump
      # invalidates it; the install below still runs on a hit and finds the
      # browser already there.
      - if: runner.os == 'Windows'
        name: Cache the Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # The browser-sniffer suite launches a real Chromium; without this it
      # would skip or fail depending on the runner image.
      #
      # `--with-deps` on Linux only. It means two different things per platform:
      # on Linux it is `apt-get` for Chromium's shared libraries, which the
      # runner does not ship and the launch genuinely needs — 16 seconds. On
      # Windows it shells out to DISM to enable the *Media Foundation* Windows
      # feature, which took 200 of this job's 306 seconds and is the single
      # largest line item in the whole pull request. Nothing here decodes video:
      # the sniffer reads network traffic, and the ffmpeg suite spawns its own
      # binary. So Windows gets the browser and not the feature.
      - run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
      # The `ffmpeg-static` fallback is a binary built against a much older
      # glibc, and on this runner it dies of SIGSEGV with an empty stderr the
      # moment the engine spawns it — every hls-e2e case, and only here: the
      # same commit passes on the Windows runner and against a distribution
      # build locally. Point FFMPEG_PATH at the distro binary, which is what
      # the image and the dev container already do, and for the same reason.
      - if: runner.os == 'Linux'
        name: Use the distribution's ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          echo "FFMPEG_PATH=/usr/bin/ffmpeg" >> "$GITHUB_ENV"
      - run: npm test

  # The slow, downloader-specific gates — end-to-end, the container, and the
  # Windows suite — live in `downloader.yml`, which only runs when that tool or
  # the packages beneath it change. Nothing here should grow tool-specific: this
  # workflow is what every tool in the repo pays on every change.
