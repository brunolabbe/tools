name: CI

# `push` is `main` only, deliberately. A branch with an open pull request fires
# both events, and because the two carry different `github.ref` values their
# concurrency groups do not collide — so every commit used to buy two identical
# runs. The pull request is the one that gates the merge; the `main` push is the
# one that records the merged state. A branch with no pull request open yet is
# not worth a runner.
#
# Markdown is skipped, and it is worth saying why that is safe here rather than
# reflexive. Appending to a ticket's Log when work finishes is a standing rule
# in CLAUDE.md, so documentation-only commits are routine, not rare: `d97db2c`
# edited `docs/01-TICKETS.md` and nothing else, and bought five minutes and
# fifty-four seconds of Linux and Windows suites for it. No `.md` in this
# repository is a test fixture — every one is prose — and the ruleset on `main`
# requires no status checks, so a skipped workflow cannot leave a pull request
# pending forever. Release pull requests still run: release-please touches
# `version.txt` and the manifest alongside the changelog.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  # Nightly against `main`, because the failures this repo actually hits are
  # environmental and no commit triggers them. The `ffmpeg-static` SIGSEGV
  # documented below appeared when a runner image changed underneath us, not
  # when anyone wrote code; a nightly finds that on a Tuesday instead of during
  # a release. 07:00 UTC — off-peak, and long after the day's work has landed.
  schedule:
    - cron: "0 7 * * *"
  # So a failure can be re-run without an empty commit.
  workflow_dispatch:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The resolver tests never reach a real site, and the browsers they do need
  # come from the job that installs them explicitly.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  # Lint, format and typecheck. Split out because it answers in under a minute
  # and a formatting failure should not wait on a browser download.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  # The unit and integration suites. On both platforms, because this project
  # has a genuine Windows story — but narrower than it looks, and worth naming
  # precisely so nobody deletes the wrong half. `buildTaskkillArgs` and
  # `sanitizeFilename("CON")` are pure functions and answer identically on
  # Linux; their tests are not why this matrix exists. The reason is
  # `hls-e2e.test.ts`'s "cancelling kills the process tree and leaves no
  # artifacts", which has no `skipIf`: on this runner it spawns a real
  # `ffmpeg-static`, takes `killTreeWindows` into a real `taskkill.exe`, and
  # asserts nothing was orphaned. That is the only execution of `taskkillPath()`
  # anywhere, and it pins the process-tree rule in CLAUDE.md.
  #
  # This ran briefly path-filtered to the downloader, on the theory that every
  # Windows hazard is that tool's. It is unfiltered again: the filter was a
  # concession to a Windows minute costing 1.67x a Linux one, and on a public
  # repository it costs nothing. A root `package.json`, a tsconfig or a vitest
  # setting can all change Windows behaviour without touching a downloader
  # path, and a filter that never fires for them is a gap, not a saving.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Every workspace is consumed through its `dist` — that is what its
      # package.json `exports` points at — so a tree that has never been built
      # cannot resolve a single cross-package import. Locally this is invisible,
      # because `npm run check` typechecks with `tsc --build` and leaves the
      # output behind; a fresh checkout has nothing.
      - run: npm run build
      # Windows only, and that asymmetry is measured rather than assumed.
      # Downloading Chromium there is minutes; on the Linux runner it is ~20
      # seconds against a CDN, which is less than this step spends restoring
      # 282 MB. A cache that saves six seconds is not free — every branch that
      # touches the lockfile writes its own copy, and the repository's 10 GB
      # cache quota is what pays. Keyed on the lockfile, so a Playwright bump
      # invalidates it; the install below still runs on a hit and finds the
      # browser already there.
      - if: runner.os == 'Windows'
        name: Cache the Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # The browser-sniffer suite launches a real Chromium; without this it
      # would skip or fail depending on the runner image.
      #
      # `--with-deps` on Linux only. It means two different things per platform:
      # on Linux it is `apt-get` for Chromium's shared libraries, which the
      # runner does not ship and the launch genuinely needs — 16 seconds. On
      # Windows it shells out to DISM to enable the *Media Foundation* Windows
      # feature, which took 200 of this job's 306 seconds and is the single
      # largest line item in the whole pull request. Nothing here decodes video:
      # the sniffer reads network traffic, and the ffmpeg suite spawns its own
      # binary. So Windows gets the browser and not the feature.
      - run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
      # The `ffmpeg-static` fallback is a binary built against a much older
      # glibc, and on this runner it dies of SIGSEGV with an empty stderr the
      # moment the engine spawns it — every hls-e2e case, and only here: the
      # same commit passes on the Windows runner and against a distribution
      # build locally. Point FFMPEG_PATH at the distro binary, which is what
      # the image and the dev container already do, and for the same reason.
      - if: runner.os == 'Linux'
        name: Use the distribution's ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          echo "FFMPEG_PATH=/usr/bin/ffmpeg" >> "$GITHUB_ENV"
      - run: npm test

  # The slow, downloader-specific gates — end-to-end, the container, and the
  # Windows suite — live in `downloader.yml`, which only runs when that tool or
  # the packages beneath it change. Nothing here should grow tool-specific: this
  # workflow is what every tool in the repo pays on every change.
