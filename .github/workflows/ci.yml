name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # So a failure can be re-run without an empty commit.
  workflow_dispatch:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The resolver tests never reach a real site, and the browsers they do need
  # come from the job that installs them explicitly.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  # Lint, format and typecheck. Split out because it answers in under a minute
  # and a formatting failure should not wait on a browser download.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  # The unit and integration suites. On both platforms, because this project
  # has a genuine Windows story — process-tree kills use `taskkill`, paths are
  # confined with `path.relative`, and reserved filenames like `CON` are a
  # Windows-only hazard. Linux-only CI would not exercise any of it.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browser-sniffer suite launches a real Chromium; without this it
      # would skip or fail depending on the runner image.
      - run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
      - run: npm test

  # The slow, downloader-specific gates — end-to-end and the container — live in
  # `downloader.yml`, which only runs when that tool or the packages beneath it
  # change. Nothing here should grow tool-specific: this workflow is what every
  # tool in the repo pays on every push.
