name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # So a failure can be re-run without an empty commit.
  workflow_dispatch:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The resolver tests never reach a real site, and the browsers they do need
  # come from the job that installs them explicitly.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  # Lint, format and typecheck. Split out because it answers in under a minute
  # and a formatting failure should not wait on a browser download.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  # The unit and integration suites. On both platforms, because this project
  # has a genuine Windows story — process-tree kills use `taskkill`, paths are
  # confined with `path.relative`, and reserved filenames like `CON` are a
  # Windows-only hazard. Linux-only CI would not exercise any of it.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browser-sniffer suite launches a real Chromium; without this it
      # would skip or fail depending on the runner image.
      - run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
      - run: npm test

  # The whole stack in one piece: real UI, real API, real ffmpeg, real file.
  # Linux only — it is the slowest job and the thing it proves is not
  # platform-specific.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
      - run: npm run e2e
      # Traces and video, kept only when something failed — that is the whole
      # reason `trace: retain-on-failure` is set.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts
          path: e2e/.artifacts/results
          retention-days: 7

  # `docker compose up` from a clean machine is the M4 acceptance criterion, so
  # it is checked rather than assumed. Builds the image and waits for the
  # service's own health endpoint to report ready.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose build
      - run: docker compose up -d
      - name: Wait for the service to report healthy
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 5
          done
          echo "the service never became healthy"
          docker compose logs
          exit 1
      - if: always()
        run: docker compose down -v
