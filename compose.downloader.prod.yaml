# The downloader's production overlay: its released image, on the shared edge.
#
#   docker compose -f compose.downloader.yaml -f compose.prod.yaml \
#                  -f compose.downloader.prod.yaml up -d
#
# or, once `COMPOSE_FILE` is set in `.env`, a bare `docker compose up -d`.
#
# ## Why this is a file of its own, and not a block in compose.prod.yaml
#
# `docs/adr/004-one-compose-fragment-per-tool.md`: what stays in the shared
# overlay is what belongs to the **host** rather than to any tool — the tunnel,
# and the network the tools share. Everything that names a tool is a fragment of
# that tool's own, so no host runs a service it did not name. This file is the
# downloader's half and `compose.planner.prod.yaml` is the planner's; they are
# the same shape on purpose.
#
# It changes six things about the service `compose.downloader.yaml` defines:
#
#  - the image is **pulled, not built**. That file builds from source because
#    that is what a developer wants; a deployed host wants a released artifact it
#    can name and roll back to. See docs/03-RELEASING.md.
#  - `TRUST_PROXY` names the `edge` subnet. Every rate limit is keyed on
#    `request.ip`, and with a proxy in front that address is cloudflared's on
#    every request unless the header is trusted.
#  - `cloudflared` waits on this service's health check before it registers.
#  - its log is capped by size, which is what the terms page's retention rests on
#    (dl-54); the comment on `logging` below says what that does and does not do.
#  - the human check's keys come from the host's `.env` (dl-50), empty by default.
#  - the limits are **set, not inherited**: concurrency, file size and the two
#    creation rate limits are written out here from the owner's measurements, so a
#    later change to a default in `API_DEFAULTS` does not silently move production
#    (dl-52). The comment on each says where its value came from.
#
# The loopback port inherited from `compose.downloader.yaml` stays, but it is for
# debugging from the host — it is not how anything is served.

name: webtools

services:
  downloader:
    # A released image from the registry, pinned by version.
    # `compose.downloader.yaml`'s `build:` section is still merged in underneath
    # — compose has no way to unset it — which is what `pull_policy` is for:
    # without it, `up -d` on a host that happens to have a stale local image
    # would use that instead of pulling the version named here.
    #
    # DOWNLOADER_TAG is required rather than defaulted to `latest` on purpose. A
    # host following a moving tag cannot answer "what is it running", and
    # rolling back means guessing. `/api/health` reports the version, and it
    # matches this line because release-please stamps both.
    image: "ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in .env - see docs/02-DEPLOYMENT.md}/downloader:${DOWNLOADER_TAG:?set DOWNLOADER_TAG in .env to a released version - see docs/03-RELEASING.md}"
    pull_policy: always

    # How long the container's log keeps a visitor's address (dl-54). The terms
    # page promises 14 days, and every `request` line carries the client address.
    #
    # **This is a size cap, not an age limit, and Docker has no option for age:**
    # `json-file` rotates when a file reaches `max-size` and keeps `max-file`
    # files, and the `local` driver takes the same two options. So the figure
    # below is a size chosen to hold about 14 days of the traffic it was sized
    # for, and it holds longer on a quiet host and shorter on a busy one.
    #
    # How it was derived. A first visit, run against a live API with the real
    # engine at `info` — the level `compose.downloader.yaml` sets, under which
    # `/api/health`'s polling is not written — wrote 16 lines: 11 `request` lines
    # (the page, its two assets, a favicon, `/api/config`, the probe and its event
    # stream, the job, its link and its event stream, a preview), one `request
    # rejected` for the preview miss, and `probe complete`, `job accepted`,
    # `engine stream complete` and `job completed`. That is 5,848 bytes once
    # Docker wraps each line in its own JSON envelope (curl stood in for the
    # browser, and the preview was a miss, which costs a line more than a hit; the
    # bytes are in dl-54's Log). The API alone, with no page, is 7 lines and 2,551
    # bytes. Call a visit 6 KB: 10 MB x 5 files is 50 MB, which is about 8,300
    # visits, or 600 a day for 14 days. A failed visit adds a `request failed`
    # line, and a return visit is smaller because the assets are cached.
    # **That traffic is an assumption: nothing measured this host's day.** Replace it with
    # `docker compose logs --since 24h downloader | wc -c` once there is one, and
    # see "Log retention" in docs/02-DEPLOYMENT.md for the host-side purge that
    # turns the cap into an age.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    networks: [edge]
    environment:
      # The proxy's CIDR, never `true`. `true` lets any client name its own
      # rate-limit bucket by sending X-Forwarded-For, which on a public hostname
      # makes every limit in the API decorative. cloudflared overwrites that
      # header with the real client address, so this is the one hop worth
      # trusting — and naming it by CIDR is what stops anything else being.
      #
      # This is `compose.prod.yaml`'s `edge` subnet, named again — see the
      # `networks.edge.ipam` comment there, which names every copy.
      TRUST_PROXY: "172.30.42.0/24"

      # The human check on probe and job creation (dl-50), from the host's
      # `.env`. Empty by default, which leaves the check off — the right state
      # while the hostname is behind Access. Both or neither: the API refuses
      # to start with one. See `.env.prod.example`.
      TURNSTILE_SITE_KEY: "${TURNSTILE_SITE_KEY:-}"
      TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY:-}"

      # --- Limits for traffic that is not just you (dl-52) -----------------
      # Every value below is set even where it equals `API_DEFAULTS`
      # (`tools/downloader/api/src/config.ts`), so that a later change to a
      # default does not silently move production. The measurements are the
      # owner's, taken on 2026-10-05 on the host running `downloader-v0.8.0`
      # against the hls.js demo stream (10:35, five renditions); the full table
      # is in tools/downloader/docs/work/dl-52-limits-for-anonymous-traffic.md.

      # What limits this host is the browser, not the line. Measured: two probes
      # at once peaked at 250% CPU and 800 MiB of the container's 4 GiB, about
      # 125% and 400 MiB each, and both fell when analysis ended. Two probes
      # already use 2.5 cores, so two is the size of the host, not a default
      # that happens to match.
      MAX_CONCURRENT_BROWSERS: "2"

      # Measured: one 1080p job ran at 3.6 MB/s (about 29 Mbps, 5x real time)
      # and took about 40 Mbps of a 329 Mbps upload (289 Mbps while it ran). A
      # job runs as fast as its source allows, not at the stream's bitrate, so
      # upload covers about ten of them and is not what binds; two is the
      # owner's choice, kept at the default.
      MAX_CONCURRENT_JOBS: "2"

      # MAX_CONCURRENT_FRAME_GRABS is deliberately unset. It follows
      # MAX_CONCURRENT_JOBS, and nothing measured says it should differ: a frame
      # grab was not isolated in the 2026-10-05 measurements. Set it here only
      # once one has been.

      # The owner's choice, against the 1024 that was recommended: about 90
      # minutes of 1080p at the measured 5.9 Mbps, so a whole film fits. It is
      # also today's default, written out. At 29 Mbps a file this size holds a
      # job slot for about 20 minutes.
      MAX_FILE_SIZE_MB: "4096"

      # Policy, not something a host measurement sizes: the proposal in the
      # ticket's table, stated to the owner with the questions and not asked
      # separately. Per client address. The events limit is set with the probe
      # limit because the two are used one-for-one (the web client subscribes,
      # then POSTs the probe it names): its default of 10 is looser than the
      # probe's 4, so leaving it would break the "same number" that
      # `rate-limit.test.ts` pins for the defaults.
      RATE_LIMIT_PROBE_PER_MINUTE: "4"
      RATE_LIMIT_PROBE_EVENTS_PER_MINUTE: "4"
      RATE_LIMIT_JOBS_PER_MINUTE: "2"

      # **The owner's choice, against the 1 that was recommended, and a trade
      # made knowingly.** It equals MAX_CONCURRENT_JOBS, so one address can hold
      # both running slots, and while it does every other visitor's download
      # waits in line or is refused. The cap is keyed on the client address, so a
      # household behind one router shares it. 1 would keep a slot free for a
      # stranger; the owner declined that on 2026-10-05. dl-51's comment, "one
      # client should not be able to hold both of the default two running slots",
      # is the argument this value chose to set aside, so do not read it as an
      # oversight.
      MAX_JOBS_PER_CLIENT: "2"

  cloudflared:
    # Merged into the definition in `compose.prod.yaml` rather than repeating
    # it, exactly as `compose.planner.prod.yaml` does for the planner. This is
    # what lets the shared overlay carry the tunnel without having heard of
    # either tool: a host that merges only the planner's fragments gets a
    # `cloudflared` that waits on the planner alone.
    depends_on:
      downloader:
        # No public hostname until the service passes its own health check.
        # Without this a restart publishes a hostname that 502s for the twenty
        # seconds the SQLite migrations take, which reads to a user as the site
        # being broken rather than as it still starting.
        condition: service_healthy
